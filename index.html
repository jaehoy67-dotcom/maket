<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>진영 유치원 스마트 키오스크</title>

<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

:root{
    --primary-blue:#3B5998;
    --point-yellow:#FFD43B;
    --bg-soft:#F9F8F3;
    --text-dark:#333333;
}

body{
    font-family:'Gaegu','Nanum Gothic',sans-serif;
    background:var(--bg-soft);
    margin:0;
    text-align:center;
    overflow:hidden;
    color:var(--text-dark);
    font-size:1.3em;
}

#header-area{
    background:var(--primary-blue);
    padding:15px 10px 10px 10px;
    position:fixed;
    top:0;
    width:100%;
    z-index:150;
    border-radius:0 0 25px 25px;
}

#header-area h1{
    color:white;
    margin:0 0 10px 0;
    font-size:1.4em;
}

#tab-bar{
    display:flex;
    gap:10px;
    justify-content:center;
    max-width:90%;
    margin:0 auto;
}

.tab-btn{
    flex:1;
    padding:8px 12px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-weight:bold;
    font-size:0.9em;
}

.tab-btn.active{
    background:var(--point-yellow);
    color:black;
}

#status-list{
    position:fixed;
    top:150px;
    left:15px;
    width:140px;
    background:white;
    border-radius:20px;
    padding:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    text-align:left;
    z-index:100;
    border:3px solid var(--primary-blue);
    max-height:35vh;
    overflow-y:auto;
}

#cooking-area{
    position:relative;
    width:100%;
    height:50vh;
    margin-top:140px;
}

.ing-img{
    position:absolute;
    transition:all 0.5s;
    pointer-events:none;
}

#control-panel{
    position:fixed;
    bottom:0;
    width:100%;
}

#menu-bar{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:20px;
    background:white;
    border-radius:30px 30px 0 0;
}

.btn-ing{
    padding:10px;
    border:none;
    border-radius:18px;
    background:#F8F9FA;
    font-family:'Gaegu',sans-serif;
    font-size:0.9em;
}

#order-btn{
    position:fixed;
    right:20px;
    top:150px;
    padding:15px 25px;
    background:#FF4757;
    color:white;
    border:none;
    border-radius:25px;
    font-size:1.1em;
    z-index:160;
}

#connection-status{
    position:fixed;
    top:110px;
    right:20px;
    background:white;
    padding:8px 14px;
    border-radius:15px;
    font-size:0.8em;
    z-index:200;
}

</style>
</head>

<body>

<div id="header-area">

    <h1>진영 마켓</h1>

    <div id="tab-bar">

        <button
        id="tab-burger"
        class="tab-btn active"
        onclick="switchTab('burger')">
        🍔 햄버거
        </button>

        <button
        id="tab-skewer"
        class="tab-btn"
        onclick="switchTab('skewer')">
        🍢 꼬치집
        </button>

        <button
        id="tab-drink"
        class="tab-btn"
        onclick="switchTab('drink')">
        🥤 음료수
        </button>

    </div>

</div>

<div id="connection-status">
🟡 연결 중
</div>

<div id="status-list">

<strong>
📋 담은 주머니
</strong>

<div id="item-list-content"></div>

</div>

<button id="order-btn"
onclick="sendFinalOrder()">
주문 완료 ➔
</button>

<div id="cooking-area"></div>

<div id="control-panel">

<div id="menu-bar"></div>

</div>

<script>

const connectionStatus =
document.getElementById('connection-status');

let currentRecipe = [];
let currentTab = 'burger';

const menus = {

burger:[
{id:'bun_bottom',name:'아래빵',icon:'🍞'},
{id:'patty',name:'패티',icon:'🍖'},
{id:'lettuce',name:'양상추',icon:'🥬'},
{id:'cheese',name:'치즈',icon:'🧀'},
{id:'tomato',name:'토마토',icon:'🍅'},
{id:'bun_top',name:'위빵',icon:'🍞'}
],

skewer:[
{id:'steak',name:'스테이크',icon:'🥩'},
{id:'shrimp',name:'새우',icon:'🍤'},
{id:'pepper',name:'피망',icon:'🫑'}
],

drink:[
{id:'cola',name:'콜라',icon:'🥤'},
{id:'juice',name:'주스',icon:'🧃'}
]

};

function switchTab(tab){

    currentTab = tab;

    document.querySelectorAll('.tab-btn')
    .forEach(btn=>btn.classList.remove('active'));

    document.getElementById('tab-'+tab)
    .classList.add('active');

    const menuBar =
    document.getElementById('menu-bar');

    menuBar.innerHTML =
    menus[tab].map(m=>`

        <button class="btn-ing"
        onclick="addIng('${m.id}','${m.icon} ${m.name}')">

        <div style="font-size:1.4em">
        ${m.icon}
        </div>

        ${m.name}

        </button>

    `).join('');
}

switchTab('burger');

function addIng(file,name){

    currentRecipe.push(name);

    updateList();
}

function updateList(){

    document.getElementById('item-list-content')
    .innerHTML = currentRecipe
    .map((v,i)=>`
        <div>${i+1}. ${v}</div>
    `).join('');
}

let peer;
let conn;

startConnection();

function startConnection(){

    peer = new Peer({
        debug:1
    });

    peer.on('open', ()=>{

        connectKitchen();
    });

    peer.on('disconnected', ()=>{

        try{
            peer.reconnect();
        }catch(e){}
    });

    peer.on('close', ()=>{

        setTimeout(startConnection,2000);
    });

    peer.on('error', (err)=>{

        console.log(err);
    });
}

function connectKitchen(){

    if(conn && conn.open){
        return;
    }

    connectionStatus.innerHTML =
        '🟡 주방 연결 중';

    conn = peer.connect(
        'jinyeong-burger-kitchen-2026',
        {
            reliable:true
        }
    );

    conn.on('open', ()=>{

        connectionStatus.innerHTML =
            '🟢 연결 완료';
    });

    conn.on('close', ()=>{

        connectionStatus.innerHTML =
            '🔴 재연결 중';

        setTimeout(connectKitchen,2000);
    });

    conn.on('error', ()=>{

        connectionStatus.innerHTML =
            '🔴 연결 오류';

        setTimeout(connectKitchen,2000);
    });
}

function sendFinalOrder(){

    if(currentRecipe.length===0){
        alert('메뉴를 담아 주세요!');
        return;
    }

    const customerName =
        prompt('이름을 입력해 주세요');

    if(!customerName) return;

    const orderData = {
        customer:customerName,
        recipe:currentRecipe
    };

    if(conn && conn.open){

        conn.send(orderData);

        alert('🎉 주문 완료!');

        currentRecipe = [];

        updateList();

    }else{

        alert('주방 연결 중입니다 😥');

        connectKitchen();
    }
}

</script>

</body>
</html>
