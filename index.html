<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>진영 유치원 스마트 키오스크</title>

<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

body{
    margin:0;
    font-family:'Gaegu', sans-serif;
    background:#F9F8F3;
    text-align:center;
}

h1{
    background:#3B5998;
    color:white;
    margin:0;
    padding:15px;
}

#menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:20px;
}

.menu-btn{
    padding:20px;
    border:none;
    border-radius:20px;
    background:white;
    font-size:1.2em;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
    cursor:pointer;
}

#recipe{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:20px;
    min-height:120px;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

#order-btn{
    margin:20px;
    padding:20px 40px;
    border:none;
    border-radius:25px;
    background:#FF4757;
    color:white;
    font-size:1.3em;
    font-family:'Gaegu', sans-serif;
    cursor:pointer;
}

#status{
    margin-top:10px;
    font-size:1em;
}

input{
    margin-top:20px;
    padding:15px;
    font-size:1.1em;
    border-radius:15px;
    border:3px solid #3B5998;
    text-align:center;
}

</style>
</head>

<body>

<h1>🍔 진영 스마트 키오스크</h1>

<div>
    <input
        id="name-input"
        placeholder="이름 입력"
    >
</div>

<div id="menu"></div>

<div id="recipe"></div>

<button id="order-btn">
    주문 완료
</button>

<div id="status">
    🟡 서버 연결 중...
</div>

<script>

const menus = [
    '🍞 아래빵',
    '🍖 패티',
    '🥬 양상추',
    '🧀 치즈',
    '🍅 토마토',
    '🍞 위빵'
];

const menuEl = document.getElementById('menu');
const recipeEl = document.getElementById('recipe');
const statusEl = document.getElementById('status');

let recipe = [];

menus.forEach(item => {

    const btn = document.createElement('button');

    btn.className = 'menu-btn';

    btn.innerText = item;

    btn.onclick = () => {

        recipe.push(item);

        renderRecipe();
    };

    menuEl.appendChild(btn);
});

function renderRecipe(){

    recipeEl.innerHTML = recipe
        .map(v => `<div>${v}</div>`)
        .join('');
}

let peer;
let conn;

function startConnection(){

    peer = new Peer({
        debug: 2
    });

    peer.on('open', () => {

        connectKitchen();
    });

    peer.on('error', (err) => {

        console.log(err);

        statusEl.innerText = '🔴 연결 오류';
    });
}

function connectKitchen(){

    if(conn && conn.open){
        return;
    }

    statusEl.innerText = '🟡 주방 연결 중...';

    conn = peer.connect(
        'jinyeong-burger-kitchen-2026',
        {
            reliable:true
        }
    );

    conn.on('open', () => {

        console.log('주방 연결 성공');

        statusEl.innerText = '🟢 연결 완료';
    });

    conn.on('close', () => {

        statusEl.innerText = '🔴 연결 끊김';

        setTimeout(connectKitchen, 2000);
    });

    conn.on('error', () => {

        statusEl.innerText = '🔴 연결 오류';

        setTimeout(connectKitchen, 2000);
    });
}

async function sendOrder(){

    const name = document
        .getElementById('name-input')
        .value
        .trim();

    if(!name){
        alert('이름을 입력해 주세요!');
        return;
    }

    if(recipe.length === 0){
        alert('메뉴를 담아 주세요!');
        return;
    }

    if(!conn || !conn.open){

        statusEl.innerText =
            '🟡 재연결 중...';

        connectKitchen();

        setTimeout(sendOrder, 1500);

        return;
    }

    conn.send({
        customer:name,
        recipe:recipe
    });

    alert('🎉 주문 완료!');

    recipe = [];

    renderRecipe();
}

document
.getElementById('order-btn')
.onclick = sendOrder;

startConnection();

</script>

</body>
</html>
