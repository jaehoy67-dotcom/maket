<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>진영 유치원 스마트 키오스크</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

body{
    font-family:'Nanum Gothic', sans-serif;
    background:#FFFBE6;
    margin:0;
    overflow:hidden;
    text-align:center;
}

/* 상단 탭 */

#tab-bar{
    display:flex;
    background:#F39C12;
    padding:10px;
    gap:10px;
    justify-content:center;
    position:fixed;
    top:0;
    width:100%;
    z-index:100;
}

.tab-btn{
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.3);
    color:white;
    font-weight:bold;
    font-size:1rem;
}

.tab-btn.active{
    background:white;
    color:#F39C12;
}

/* 주문 목록 */

#status-list{
    position:fixed;
    top:80px;
    left:15px;
    width:150px;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:12px;
    z-index:90;
    border:2px solid #F39C12;
    max-height:40vh;
    overflow-y:auto;
    text-align:left;
}

#item-list-content{
    font-size:0.8rem;
}

/* 음식 영역 */

#cooking-area{
    position:relative;
    width:100%;
    height:60vh;
    margin-top:60px;
}

#skewer-stick{
    position:absolute;
    width:12px;
    height:350px;
    background:#8D6E63;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    border-radius:10px;
    z-index:1;
}

.ing-img{
    position:absolute;
    transition:all 0.5s;
    pointer-events:none;
}

/* 하단 메뉴 */

#control-panel{
    position:fixed;
    bottom:0;
    width:100%;
    z-index:100;
}

#menu-bar{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:15px;
    background:white;
    border-radius:30px 30px 0 0;
    box-shadow:0 -10px 20px rgba(0,0,0,0.1);
}

.btn-ing{
    padding:12px;
    border:none;
    border-radius:15px;
    background:#F39C12;
    color:white;
    font-weight:bold;
    font-size:1rem;
}

/* 버튼 */

#order-btn{
    position:fixed;
    right:20px;
    top:80px;
    background:#E74C3C;
    color:white;
    border:none;
    border-radius:40px;
    padding:15px 30px;
    font-size:1.2rem;
    font-weight:bold;
    z-index:120;
}

/* 이름 입력 */

#id-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    z-index:999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#barcode-input{
    padding:15px;
    border:2px solid #F39C12;
    border-radius:15px;
    font-size:1.2rem;
    text-align:center;
}

/* 조리중 화면 */

#waiting-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    z-index:1000;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

#waiting-box{
    background:white;
    color:#333;
    padding:50px;
    border-radius:40px;
    width:80%;
    max-width:500px;
}

#waiting-title{
    font-size:2rem;
    font-weight:bold;
    color:#F39C12;
}

#progress-wrap{
    width:100%;
    height:25px;
    background:#EEE;
    border-radius:30px;
    overflow:hidden;
    margin-top:30px;
}

#progress-bar{
    width:0%;
    height:100%;
    background:#F39C12;
}

/* 주문 완료 화면 */

#complete-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:2000;
    display:none;
    justify-content:center;
    align-items:center;
}

#complete-box{
    background:white;
    padding:60px;
    border-radius:40px;
    text-align:center;
    animation:bounce 0.5s;
}

#complete-box h1{
    color:#27AE60;
    font-size:4rem;
    margin:0;
}

#complete-box h2{
    font-size:2rem;
    color:#E67E22;
    margin-top:20px;
}

@keyframes bounce{

    0%{
        transform:scale(0.5);
    }

    70%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

</style>
</head>

<body>

<!-- 이름 입력 -->

<div id="id-screen">

    <h1>💳 이름을 입력해 주세요</h1>

    <input
        type="text"
        id="barcode-input"
        placeholder="이름 입력 후 엔터">

</div>

<!-- 조리중 화면 -->

<div id="waiting-screen">

    <div id="waiting-box">

        <div id="waiting-title">
            👨‍🍳 조리중입니다...
        </div>

        <h2 id="waiting-name"></h2>

        <div id="progress-wrap">
            <div id="progress-bar"></div>
        </div>

    </div>

</div>

<!-- 완료 화면 -->

<div id="complete-screen">

    <div id="complete-box">

        <h1>🍔 완료! 🍟</h1>

        <h2 id="complete-text"></h2>

    </div>

</div>

<!-- 상단 탭 -->

<div id="tab-bar">

    <button
        id="tab-burger"
        class="tab-btn active"
        onclick="switchTab('burger')">

        🍔 햄버거

    </button>

    <button
        id="tab-skewer"
        class="tab-btn"
        onclick="switchTab('skewer')">

        🍢 꼬치집

    </button>

    <button
        id="tab-drink"
        class="tab-btn"
        onclick="switchTab('drink')">

        🥤 음료수

    </button>

</div>

<!-- 주문 목록 -->

<div id="status-list">

    <strong>📋 주문 목록</strong>

    <div id="item-list-content"></div>

</div>

<!-- 주문 버튼 -->

<button id="order-btn" onclick="sendOrder()">

    주문하기 ➔

</button>

<!-- 음식 영역 -->

<div id="cooking-area">

    <div id="skewer-stick"></div>

</div>

<!-- 하단 메뉴 -->

<div id="control-panel">

    <div id="menu-bar"></div>

</div>

<script>

const KITCHEN_ID =
    'jinyeong-burger-kitchen-2026';

const myId =
    'customer-' + Date.now();

let customerName = '';

let currentTab = 'burger';

let currentRecipe = [];

let conn = null;

const peer = new Peer(myId,{
    host:'0.peerjs.com',
    secure:true,
    port:443
});

peer.on('open',()=>{

    connectToKitchen();

});

peer.on('connection',(connection)=>{

    connection.on('data',(data)=>{

        // 주방 완료 신호

        if(data.type === 'complete'){

            showComplete(data.customer);
        }

    });

});

function connectToKitchen(){

    conn = peer.connect(KITCHEN_ID);

    conn.on('open',()=>{

        console.log('주방 연결 성공');

    });

}

/* 메뉴 */

const menus = {

    burger:[
        { id:'bun_bottom', name:'아래빵', icon:'🍞' },
        { id:'patty', name:'패티', icon:'🍖' },
        { id:'lettuce', name:'양상추', icon:'🥬' },
        { id:'cheese', name:'치즈', icon:'🧀' },
        { id:'tomato', name:'토마토', icon:'🍅' },
        { id:'bun_top', name:'위빵', icon:'🍞' }
    ],

    skewer:[
        { id:'steak', name:'스테이크', icon:'🥩' },
        { id:'shrimp', name:'새우', icon:'🍤' },
        { id:'tomato', name:'방울토마토', icon:'🍅' },
        { id:'pepper', name:'피망', icon:'🫑' }
    ],

    drink:[
        { id:'cola', name:'콜라', icon:'🥤' },
        { id:'cider', name:'사이다', icon:'🫧' },
        { id:'juice', name:'주스', icon:'🧃' }
    ]
};

/* 이름 입력 */

document
.getElementById('barcode-input')
.addEventListener('change',(e)=>{

    customerName = e.target.value;

    document
    .getElementById('id-screen')
    .style.display = 'none';

    switchTab('burger');

});

/* 탭 변경 */

function switchTab(tab){

    currentTab = tab;

    document
    .querySelectorAll('.tab-btn')
    .forEach(btn=>btn.classList.remove('active'));

    document
    .getElementById('tab-' + tab)
    .classList.add('active');

    const menuBar =
        document.getElementById('menu-bar');

    menuBar.innerHTML =
        menus[tab]
        .map(m=>`

            <button
                class="btn-ing"
                onclick="addIng('${m.id}','${m.icon} ${m.name}')">

                ${m.icon}<br>${m.name}

            </button>

        `).join('');

    updatePositions();
}

/* 재료 추가 */

function addIng(file,name){

    const area =
        document.getElementById('cooking-area');

    const uniqueId =
        'ing-' + Date.now();

    const img =
        document.createElement('img');

    img.src = `${file}.png`;

    img.id = uniqueId;

    img.className = 'ing-img';

    area.appendChild(img);

    currentRecipe.push({
        id:uniqueId,
        file:file,
        name:name,
        tab:currentTab
    });

    updatePositions();
}

/* 위치 */

function updatePositions(){

    let burgerIndex = 0;
    let skewerIndex = 0;
    let drinkIndex = 0;

    currentRecipe.forEach(item=>{

        const el =
            document.getElementById(item.id);

        if(!el) return;

        if(item.tab === 'burger'){

            el.style.width = '260px';
            el.style.left = '50%';
            el.style.bottom =
                `${80 + burgerIndex * 30}px`;

            burgerIndex++;
        }

        else if(item.tab === 'skewer'){

            el.style.width = '180px';
            el.style.left = '20%';
            el.style.bottom =
                `${100 + skewerIndex * 50}px`;

            skewerIndex++;
        }

        else{

            el.style.width = '140px';
            el.style.left = '80%';
            el.style.bottom =
                `${80 + drinkIndex * 60}px`;

            drinkIndex++;
        }

        el.style.transform =
            'translateX(-50%)';

    });

    document
    .getElementById('item-list-content')
    .innerHTML =
        currentRecipe
        .map((i,idx)=>
            `<div>${idx+1}. ${i.name}</div>`
        )
        .join('');
}

/* 주문 전송 */

function sendOrder(){

    if(currentRecipe.length === 0){

        alert('메뉴를 골라주세요!');

        return;
    }

    if(!conn || !conn.open){

        alert('주방 연결중입니다!');

        return;
    }

    conn.send({

        type:'order',

        customer:customerName,

        customerId:myId,

        fullRecipe:currentRecipe

    });

    showWaiting();
}

/* 조리중 화면 */

function showWaiting(){

    document
    .getElementById('waiting-screen')
    .style.display = 'flex';

    document
    .getElementById('waiting-name')
    .innerText =
        `${customerName} 친구 주문 접수 완료!`;

    const bar =
        document.getElementById('progress-bar');

    bar.style.transition = 'width 20s linear';

    setTimeout(()=>{

        bar.style.width = '100%';

    },100);

}

/* 완료 화면 */

function showComplete(name){

    document
    .getElementById('waiting-screen')
    .style.display = 'none';

    document
    .getElementById('complete-screen')
    .style.display = 'flex';

    document
    .getElementById('complete-text')
    .innerText =
        `${name} 친구 주문 나왔어요~`;

    speak(name);

    setTimeout(()=>{

        location.reload();

    },5000);

}

/* 음성 */

function speak(name){

    if(!window.speechSynthesis) return;

    const text =
        `${name} 친구 주문 나왔어요`;

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = 'ko-KR';

    utterance.rate = 0.9;

    speechSynthesis.speak(utterance);

}

switchTab('burger');

</script>

</body>
</html>
