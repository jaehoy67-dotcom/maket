<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>진영 유치원 스마트 키오스크</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary-blue: #3B5998;
            --point-yellow: #FFD43B;
            --bg-soft: #F9F8F3;
            --text-dark: #333333;
        }

        body { 
            font-family: 'Gaegu', 'Nanum Gothic', sans-serif; 
            background: var(--bg-soft); 
            margin: 0; 
            text-align: center; 
            overflow: hidden; 
            color: var(--text-dark);
            font-size: 1.3em;
        }
        
        /* 1. 상단 타이틀 & 탭 바 */
        #header-area {
            background: var(--primary-blue);
            padding: 15px 10px 10px 10px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 150;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        #header-area h1 {
            color: white;
            margin: 0 0 10px 0;
            font-size: 1.4em;
            letter-spacing: 1px;
        }
        #tab-bar { display: flex; gap: 10px; justify-content: center; max-width: 90%; margin: 0 auto; }
        .tab-btn { 
            flex: 1;
            padding: 8px 12px; 
            border: 2px solid rgba(255,255,255,0.4); 
            border-radius: 18px; 
            background: rgba(255,255,255,0.15); 
            color: white; 
            font-weight: bold; 
            font-size: 0.9em; 
            cursor: pointer; 
            transition: all 0.2s;
            font-family: 'Gaegu', sans-serif;
        }
        .tab-btn.active { background: var(--point-yellow); color: var(--text-dark); border-color: var(--point-yellow); transform: scale(1.05); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* 2. 좌측 주문 리스트 */
        #status-list { 
            position: fixed; 
            top: 150px; 
            left: 15px; 
            width: 140px; 
            background: white; 
            border-radius: 20px; 
            padding: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
            text-align: left; 
            z-index: 100; 
            border: 3px solid var(--primary-blue); 
            max-height: 35vh; 
            overflow-y: auto; 
        }
        
        /* 3. 메인 조리 영역 */
        #cooking-area { position: relative; width: 100%; height: 50vh; margin-top: 140px; }
        #skewer-stick { position: absolute; width: 14px; height: 320px; background: #8D6E63; bottom: 60px; left: 50%; transform: translateX(-50%); border-radius: 10px; z-index: 1; border: 2px solid #5D4037; transition: all 0.5s ease-in-out; }

        .ing-img { position: absolute; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); animation: dropIn 0.5s ease-out; pointer-events: none; }
        @keyframes dropIn { from { transform: translateY(-500px) translateX(-50%); opacity: 0; } to { transform: translateY(0) translateX(-50%); opacity: 1; } }

        /* 4. 하단 제어 및 메뉴 패널 */
        #control-panel { position: fixed; bottom: 0; width: 100%; z-index: 150; }
        #edit-buttons { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; padding: 0 15px; }
        .edit-btn { padding: 8px 18px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; color: white; font-size: 0.85em; box-shadow: 0 4px 0 rgba(0,0,0,0.15); font-family: 'Gaegu', sans-serif;}
        .undo-btn { background: #E67E22; }
        .clear-btn { background: #7F8C8D; }

        #menu-bar { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            padding: 20px; 
            background: white; 
            border-radius: 30px 30px 0 0; 
            box-shadow: 0 -10px 25px rgba(0,0,0,0.08); 
            border-top: 4px solid var(--point-yellow);
        }
        .btn-ing { 
            padding: 10px; 
            border: none; 
            border-radius: 18px; 
            background: #F8F9FA; 
            color: var(--text-dark); 
            font-weight: bold; 
            font-size: 0.9em; 
            box-shadow: 0 5px 0 #E2E6EA; 
            border: 2px solid #E2E6EA;
            transition: all 0.1s;
            font-family: 'Gaegu', sans-serif;
        }
        .btn-ing:active { transform: translateY(3px); box-shadow: 0 2px 0 #E2E6EA; background: #FFFDEB; }

        #order-btn { 
            position: fixed; 
            right: 20px; 
            top: 150px; 
            padding: 15px 25px; 
            background: #FF4757; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            font-size: 1.1em; 
            font-weight: bold; 
            z-index: 160; 
            box-shadow: 0 6px 12px rgba(255,71,87,0.3);
            cursor: pointer;
            font-family: 'Gaegu', sans-serif;
        }
        
        /* 5. 얼굴 인식 결제 화면 */
        #face-pay-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 500; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #camera-container { position: relative; width: 280px; height: 280px; }
        #camera-view { width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--point-yellow); object-fit: cover; transform: scaleX(-1); }
        #scan-line { position: absolute; width: 100%; height: 6px; background: var(--point-yellow); box-shadow: 0 0 20px var(--point-yellow); animation: scanMove 2s infinite; left: 0; }
        @keyframes scanMove { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
        #pay-progress { width: 280px; height: 16px; background: #444; border-radius: 10px; margin-top: 25px; overflow: hidden; border: 2px solid #555; }
        #pay-bar { width: 0%; height: 100%; background: var(--point-yellow); transition: width 3.5s linear; }

        /* ID 스캔 첫 화면 */
        #id-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-soft); z-index: 600; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #id-card-box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 4px dashed var(--primary-blue); text-align: center; max-width: 80%; }
        input { padding: 15px; font-size: 1.1em; border: 3px solid var(--primary-blue); border-radius: 15px; margin-top: 20px; text-align: center; width: 80%; font-family: 'Gaegu', sans-serif; }
        
        /* 영수증 모달 디자인 */
        #receipt-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 700; display: none; justify-content: center; align-items: center; }
        .receipt-box { background: white; width: 300px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; border-top: 8px solid var(--primary-blue); position: relative; }
        .receipt-box::after { content: ''; display: block; position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px; background: linear-gradient(-45deg, white 5px, transparent 0), linear-gradient(45deg, white 5px, transparent 0); background-size: 10px 10px; }
        .receipt-title { font-size: 1.3em; color: var(--primary-blue); font-weight: bold; margin-bottom: 10px; }
        .receipt-line { border-top: 2px dashed #CCC; margin: 15px 0; }
        .receipt-close-btn { background: var(--primary-blue); color: white; border: none; padding: 10px 30px; border-radius: 15px; font-size: 1em; font-family: 'Gaegu', sans-serif; margin-top: 15px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div id="id-screen">
    <div id="id-card-box">
        <h1 style="font-size: 1.8em; margin: 0; color: var(--primary-blue);">💳 스마트 키오스크</h1>
        <p style="margin-top: 10px; color: #666;">진영 유치원 ID 카드를 찍어주세요!</p>
        <input type="text" id="barcode-input" placeholder="바코드 인식 대기 중..." autofocus>
    </div>
</div>

<div id="face-pay-screen">
    <div id="camera-container">
        <div id="scan-line"></div>
        <video id="camera-view" autoplay playsinline></video>
    </div>
    <h2 id="pay-status-text" style="margin-top:25px; font-size: 1.3em; color: var(--point-yellow);">반짝반짝! 얼굴을 맞춰주세요 🌟</h2>
    <div id="pay-progress"><div id="pay-bar"></div></div>
</div>

<div id="receipt-modal">
    <div class="receipt-box">
        <div class="receipt-title">🎫 진영 스마트 영수증</div>
        <div style="font-size: 0.9em; color:#777;" id="receipt-date"></div>
        <div class="receipt-line"></div>
        <h3 style="margin: 5px 0;" id="receipt-user"></h3>
        <p style="color: #E67E22; font-weight: bold; margin: 5px 0;">주문이 주방으로 전송되었습니다!</p>
        <div class="receipt-line"></div>
        <button class="receipt-close-btn" onclick="closeReceiptAndReload()">확인 완료 👍</button>
    </div>
</div>

<div id="header-area">
    <h1>진영 마켓</h1>
    <div id="tab-bar">
        <button id="tab-burger" class="tab-btn active" onclick="switchTab('burger')">🍔 햄버거</button>
        <button id="tab-skewer" class="tab-btn" onclick="switchTab('skewer')">🍢 꼬치집</button>
        <button id="tab-drink" class="tab-btn" onclick="switchTab('drink')">🥤 음료수</button>
    </div>
</div>

<div id="status-list">
    <strong style="color: var(--primary-blue); font-size: 0.9em; display: block; border-bottom: 2px solid #EEE; padding-bottom: 5px; margin-bottom: 5px;">📋 담은 주머니</strong>
    <div id="item-list-content" style="font-size: 0.8em; line-height: 1.4;"></div>
</div>

<button id="order-btn" onclick="startFacePay()">주문 완료 ➔</button>

<div id="cooking-area">
    <div id="skewer-stick"></div>
</div>

<div id="control-panel">
    <div id="edit-buttons">
        <button class="edit-btn undo-btn" onclick="undoLast()">↩ 하나 빼기</button>
        <button class="edit-btn clear-btn" onclick="clearAll()">🗑 다 지우기</button>
    </div>
    <div id="menu-bar"></div>
</div>

<script>
    // 🛠 [통신 수정] 앱이 켜지자마자 주방에 무선 다리를 미리 연결하도록 최상단에 배치
    let peer = new Peer();
    let conn;
    let currentRecipe = [];
    let currentTab = 'burger';
    let customerName = "";

    // 주방 서버와 자동으로 다리를 연결하는 핵심 함수
    function connectToKitchen() {
        if (!conn) {
            conn = peer.connect('jinyeong-burger-kitchen-2026');
            conn.on('open', () => { console.log("주방 서버와 연결 성공!"); });
            conn.on('error', (err) => { console.log("연결 오류 발생, 재시도 중...", err); });
        }
    }

    // Peer 서버가 준비되면 바로 주방 서버를 찾아서 연결을 시도합니다.
    peer.on('open', () => { connectToKitchen(); });

    const menus = {
        burger: [
            { id: 'bun_bottom', name: '아래빵', icon: '🍞' },
            { id: 'patty', name: '패티', icon: '🍖' },
            { id: 'lettuce', name: '양상추', icon: '🥬' },
            { id: 'cheese', name: '치즈', icon: '🧀' },
            { id: 'tomato', name: '토마토', icon: '🍅' },
            { id: 'bun_top', name: '위빵', icon: '🍞' }
        ],
        skewer: [
            { id: 'steak', name: '스테이크', icon: '🥩' },
            { id: 'shrimp', name: '새우', icon: '🍤' },
            { id: 'tomato', name: '방울토마토', icon: '🍅' },
            { id: 'pepper', name: '피망', icon: '🫑' }
        ],
        drink: [
            { id: 'cola', name: '콜라', icon: '🥤' },
            { id: 'cider', name: '사이다', icon: '🫧' },
            { id: 'juice', name: '주스', icon: '🧃' }
        ]
    };

    // ID 바코드 스캔 처리 로직
    document.getElementById('barcode-input').addEventListener('change', (e) => {
        customerName = e.target.value.trim();
        if(!customerName) return;
        document.getElementById('id-screen').style.display = 'none';
        
        // 만약 통신이 끊겨있다면 바코드가 찍히는 즉시 한번 더 재연결망을 확보합니다.
        connectToKitchen();
        switchTab('burger');
    });

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        updatePositions();

        const menuBar = document.getElementById('menu-bar');
        menuBar.innerHTML = menus[tab].map(m => `
            <button class="btn-ing" onclick="addIng('${m.id}', '${m.icon} ${m.name}')">
                <span style="font-size:1.4em; display:block; margin-bottom:3px;">${m.icon}</span>${m.name}
            </button>
        `).join('');
    }

    function addIng(file, name) {
        const area = document.getElementById('cooking-area');
        const uniqueId = 'ing-' + Date.now();
        const img = document.createElement('img');
        img.src = `${file}.png`;
        img.id = uniqueId;
        img.className = 'ing-img';
        currentRecipe.push({ id: uniqueId, name: name, file: file, tab: currentTab });
        area.appendChild(img);
        updatePositions();
    }

    function undoLast() {
        if (currentRecipe.length === 0) return;
        const lastItem = currentRecipe.pop();
        const el = document.getElementById(lastItem.id);
        if (el) el.remove();
        updatePositions();
    }

    function clearAll() {
        if (currentRecipe.length === 0) return;
        currentRecipe.forEach(item => document.getElementById(item.id)?.remove());
        currentRecipe = [];
        updatePositions();
    }

    function updatePositions() {
        const bStick = document.getElementById('skewer-stick');
        let bIdx = 0, sIdx = 0, dIdx = 0;

        const posConfig = {
            burger: { burger: {x:'50%', s:1}, skewer: {x:'18%', s:0.55}, drink: {x:'82%', s:0.55} },
            skewer: { skewer: {x:'50%', s:1}, burger: {x:'18%', s:0.55}, drink: {x:'82%', s:0.55} },
            drink: { drink: {x:'50%', s:1}, burger: {x:'18%', s:0.55}, skewer: {x:'82%', s:0.55} }
        };

        const config = posConfig[currentTab];
        bStick.style.left = config.skewer.x;
        bStick.style.transform = `translateX(-50%) scale(${config.skewer.s})`;
        bStick.style.opacity = (currentTab === 'skewer') ? 1 : 0.4;

        const counts = { burger: 0, skewer: 0, drink: 0 };
        currentRecipe.forEach(item => counts[item.tab]++);

        const baseGap = { burger: 32, skewer: 55, drink: 65 };
        
        const shrinkBurger = counts.burger > 6 ? (6 / counts.burger) : 1;
        const shrinkSkewer = counts.skewer > 5 ? (5 / counts.skewer) : 1;
        const shrinkDrink  = counts.drink > 4 ? (4 / counts.drink) : 1;

        currentRecipe.forEach((item) => {
            const el = document.getElementById(item.id);
            if (!el) return;
            const c = config[item.tab];
            
            let finalScale = c.s;
            let currentGap = baseGap[item.tab] * c.s;

            if (item.tab === 'burger') {
                finalScale *= shrinkBurger;
                currentGap *= shrinkBurger;
                
                el.style.width = '240px';
                el.style.left = c.x;
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${60 + (bIdx * currentGap)}px`;
                el.style.zIndex = bIdx + (item.tab === currentTab ? 100 : 10);
                bIdx++;
            } 
            else if (item.tab === 'skewer') {
                finalScale *= shrinkSkewer;
                currentGap *= shrinkSkewer;
                
                el.style.width = '160px';
                el.style.left = c.x;
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${90 + (sIdx * currentGap)}px`;
                el.style.zIndex = sIdx + (item.tab === currentTab ? 100 : 10);
                sIdx++;
            } 
            else if (item.tab === 'drink') {
                finalScale *= shrinkDrink;
                currentGap *= shrinkDrink;
                
                el.style.width = '130px';
                el.style.left = c.x;
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${60 + (dIdx * currentGap)}px`;
                el.style.zIndex = dIdx + (item.tab === currentTab ? 100 : 10);
                dIdx++;
            }

            el.style.opacity = (item.tab === currentTab) ? 1 : 0.5;
        });

        document.getElementById('item-list-content').innerHTML = currentRecipe.map((i, idx) => `<div>${idx+1}. ${i.name}</div>`).join('');
    }

    async function startFacePay() {
        if (currentRecipe.length === 0) return;
        const screen = document.getElementById('face-pay-screen');
        const video = document.getElementById('camera-view');
        const bar = document.getElementById('pay-bar');

        screen.style.display = 'flex';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
        } catch (e) {
            sendFinalOrder();
            return;
        }

        setTimeout(() => { bar.style.width = '100%'; }, 200);

        setTimeout(() => {
            if(video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            sendFinalOrder();
        }, 3800);
    }

    function sendFinalOrder() {
        // 🛠 [통신 수정] 만약 끊겼을 때를 대비해 연결 유무를 체크하고 데이터를 전송합니다.
        if (conn && conn.open) {
            conn.send({ customer: customerName, recipe: currentRecipe.map(i => i.name) });
        } else {
            console.log("주방 서버와 연결이 원활하지 않아 재시도 후 전송합니다.");
            conn = peer.connect('jinyeong-burger-kitchen-2026');
            setTimeout(() => {
                if(conn && conn.open) conn.send({ customer: customerName, recipe: currentRecipe.map(i => i.name) });
            }, 800);
        }
        
        document.getElementById('face-pay-screen').style.display = 'none';
        
        const now = new Date();
        document.getElementById('receipt-date').innerText = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        document.getElementById('receipt-user').innerText = `👤 ${customerName} 어린이`;
        document.getElementById('receipt-modal').style.display = 'flex';
    }

    function closeReceiptAndReload() {
        location.reload();
    }
</script>
</body>
</html>
