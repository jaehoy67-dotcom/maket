<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>진영 유치원 스마트 키오스크</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary-blue: #3B5998;
            --point-yellow: #FFD43B;
            --bg-soft: #F9F8F3;
            --text-dark: #333333;
        }

        body { 
            font-family: 'Gaegu', 'Nanum Gothic', sans-serif; 
            background: var(--bg-soft); 
            margin: 0; \
            text-align: center; 
            overflow: hidden; 
            color: var(--text-dark);
            font-size: 1.3em;
        }
        
        #header-area {
            background: var(--primary-blue);
            padding: 15px 10px;
            color: white;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #header-area h1 { margin: 0 0 12px 0; font-size: 1.6em; color: var(--point-yellow); letter-spacing: 1px; }
        
        .tab-bar { display: flex; justify-content: center; gap: 15px; }
        .tab-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            color: white;
            padding: 10px 25px;
            font-size: 1.05em;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Gaegu', sans-serif;
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--point-yellow);
            color: var(--text-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        #main-container { display: flex; height: calc(100vh - 130px); position: relative; }
        
        #menu-bar {
            width: 20%;
            background: #FFF;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            z-index: 5;
        }
        .btn-ing {
            background: #F0F3F6;
            border: 2px solid #E2E8F0;
            padding: 12px 5px;
            font-size: 0.95em;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Gaegu', sans-serif;
            font-weight: bold;
            transition: 0.15s;
        }
        .btn-ing:active { transform: scale(0.95); background: #E2E8F0; }

        #cooking-area {
            width: 60%;
            position: relative;
            background: #FFFDF7;
            background-image: radial-gradient(#EAE6D9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .ing-img {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #skewer-stick {
            position: absolute;
            bottom: 40px;
            width: 25px;
            height: 480px;
            background: #D7CCC8;
            border-radius: 10px;
            border: 3px solid #8D6E63;
            box-shadow: 3px 5px 10px rgba(0,0,0,0.15);
            transition: all 0.4s ease;
            transform-origin: bottom center;
        }

        #sidebar-right {
            width: 20%;
            background: #FFF;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        #item-list-box { flex: 1; padding: 15px; overflow-y: auto; text-align: left; border-bottom: 2px dashed #E2E8F0; }
        #item-list-box h3 { margin-top: 0; color: var(--primary-blue); font-size: 1.1em; border-bottom: 2px solid var(--primary-blue); padding-bottom: 5px; }
        #item-list-content { font-size: 0.9em; line-height: 1.5; color: #555; }
        
        .control-btns { padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #FAFBFD; }
        .btn-side {
            width: 100%;
            padding: 12px 0;
            font-size: 1em;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: 'Gaegu', sans-serif;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-undo { background: #E0E0E0; color: #333; }
        .btn-clear { background: #FAB1A0; color: #C0392B; }
        .btn-order { background: #2ECC71; color: white; font-size: 1.15em; box-shadow: 0 4px 6px rgba(46,204,113,0.3); }
        .btn-order:active { transform: scale(0.98); }

        /* 화면 팝업 스크린 레이아웃 */
        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        
        #id-screen input {
            font-size: 1.5em; padding: 12px; text-align: center; border-radius: 15px;
            border: 4px solid var(--point-yellow); width: 280px; margin-top: 20px; font-family: 'Gaegu', sans-serif;
        }

        #camera-view { width: 340px; height: 260px; background: #000; border-radius: 20px; border: 4px solid white; transform: rotateY(180deg); object-fit: cover; }
        #pay-progress-container { width: 340px; height: 15px; background: #555; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        #pay-bar { width: 0%; height: 100%; background: #2ECC71; transition: width 3.6s linear; }

        .modal-box { background: white; color: #333; padding: 30px; border-radius: 25px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .receipt-line { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="id-screen" class="fullscreen-overlay">
        <h2 style="font-size: 1.8em; color: var(--point-yellow); margin-bottom: 5px;">바코드를 찍어주세요 🏷️</h2>
        <p style="font-size: 1.1em; margin: 0;">어린이의 이름을 키보드로 입력 후 엔터를 쳐도 됩니다.</p>
        <input type="text" id="barcode-input" placeholder="이름을 입력하세요..." autofocus>
    </div>

    <div id="face-pay-screen" class="fullscreen-overlay" style="display: none;">
        <h2 style="font-size: 1.6em; color: var(--point-yellow); margin-bottom: 15px;">😀 카메라를 보고 싱긋 웃어주세요!</h2>
        <video id="camera-view" autoplay playsinline></video>
        <div id="pay-progress-container"><div id="pay-bar"></div></div>
        <p style="margin-top: 15px; color: #DDD; font-size: 0.9em;">얼굴 인식 및 주방 전송 처리 중...</p>
    </div>

    <div id="receipt-modal" class="fullscreen-overlay" style="display: none;">
        <div class="modal-box">
            <h2 style="color: var(--primary-blue); margin-top:0;">🧾 주문 영수증</h2>
            <p style="font-size:0.85em; color:#777; margin:-10px 0 15px 0;" id="receipt-date">2026-00-00 00:00</p>
            <div style="border-top: 2px dashed #DDD; border-bottom: 2px dashed #DDD; padding: 15px 0; margin-bottom: 20px; text-align: left;">
                <div class="receipt-line"><span style="font-weight: bold;" id="receipt-user">👤 어린이</span><span>주문 완료</span></div>
                <div class="receipt-line" style="color: #777; font-size: 0.8em;">* 주방 모니터로 전송되었습니다.</div>
            </div>
            <button class="btn-side btn-order" onclick="closeReceiptAndReload()">확인 (처음으로)</button>
        </div>
    </div>

    <div id="header-area">
        <h1>🍔 진영 유치원 맛있는 요리조리 키오스크 🍕</h1>
        <div class="tab-bar">
            <button id="tab-burger" class="tab-btn" onclick="switchTab('burger')">🍔 수제버거</button>
            <button id="tab-skewer" class="tab-btn" onclick="switchTab('skewer')">🍢 모둠꼬치</button>
            <button id="tab-drink" class="tab-btn" onclick="switchTab('drink')">🥤 시원한음료</button>
        </div>
    </div>

    <div id="main-container">
        <div id="menu-bar"></div>
        <div id="cooking-area">
            <div id="skewer-stick"></div>
        </div>
        <div id="sidebar-right">
            <div id="item-list-box">
                <h3>🛒 내가 담은 재료</h3>
                <div id="item-list-content"></div>
            </div>
            <div class="control-btns">
                <button class="btn-side btn-undo" onclick="undoLast()">↩ 하나 빼기</button>
                <button class="btn-side btn-clear" onclick="clearAll()">❌ 다 비우기</button>
                <button class="btn-side btn-order" onclick="startFacePay()">🚀 주문하기</button>
            </div>
        </div>
    </div>

<script>
    // 🛠 주방과 동일 규격의 통신 서버망 설정 옵션 적용
    const peerOptions = {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    };

    let peer = new Peer(peerOptions);
    let conn = null;
    let currentRecipe = [];
    let currentTab = 'burger';
    let customerName = "";

    // 주방 모니터 연결 매핑 헬퍼 함수
    function connectToKitchen() {
        if (!conn || !conn.open) {
            console.log("주방 서버 수신 상태 연결 매핑 시도...");
            conn = peer.connect('jinyeong-burger-kitchen-2026');
            
            conn.on('open', () => { 
                console.log("주방 서버 상호 다리 연결 성공!"); 
            });
            
            conn.on('close', () => {
                console.log("주방 서버 통신 끊김 감지. 2초 후 자동 재접속을 시도합니다.");
                conn = null;
                setTimeout(connectToKitchen, 2000);
            });

            conn.on('error', (err) => { 
                console.log("통신 에러 발생:", err); 
                conn = null;
            });
        }
    }

    // 서버가 준비되면 즉시 주방 연결 타겟팅 시작
    peer.on('open', () => { connectToKitchen(); });
    peer.on('disconnected', () => { peer.reconnect(); });

    const menus = {
        burger: [
            { id: 'bun_bottom', name: '아래빵', icon: '🍞' },
            { id: 'patty', name: '패티', icon: '🍖' },
            { id: 'lettuce', name: '양상추', icon: '🥬' },
            { id: 'cheese', name: '치즈', icon: '🧀' },
            { id: 'tomato', name: '토마토', icon: '🍅' },
            { id: 'bun_top', name: '위빵', icon: '🍞' }
        ],
        skewer: [
            { id: 'steak', name: '스테이크', icon: '🥩' },
            { id: 'shrimp', name: '새우', icon: '🍤' },
            { id: 'tomato', name: '방울토마토', icon: '🍅' },
            { id: 'pepper', name: '피망', icon: '🫑' }
        ],
        drink: [
            { id: 'cola', name: '콜라', icon: '🥤' },
            { id: 'cider', name: '사이다', icon: '🫧' },
            { id: 'juice', name: '주스', icon: '🧃' }
        ]
    };

    // 등원 스캔 및 이름 지정 엔터 입력 이벤트
    document.getElementById('barcode-input').addEventListener('change', (e) => {
        customerName = e.target.value.trim();
        if(!customerName) return;
        document.getElementById('id-screen').style.display = 'none';
        
        // 사용자가 입장하는 즉시 네트워크 무선 다리를 재정비합니다.
        connectToKitchen();
        switchTab('burger');
    });

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        updatePositions();

        const menuBar = document.getElementById('menu-bar');
        menuBar.innerHTML = menus[tab].map(m => `
            <button class="btn-ing" onclick="addIng('${m.id}', '${m.icon} ${m.name}')">
                <span style="font-size:1.4em; display:block; margin-bottom:3px;">${m.icon}</span>${m.name}
            </button>
        `).join('');
    }

    function addIng(file, name) {
        const area = document.getElementById('cooking-area');
        const uniqueId = 'ing-' + Date.now();
        const img = document.createElement('img');
        img.src = `${file}.png`;
        img.id = uniqueId;
        img.className = 'ing-img';
        currentRecipe.push({ id: uniqueId, name: name, file: file, tab: currentTab });
        area.appendChild(img);
        updatePositions();
    }

    function undoLast() {
        if (currentRecipe.length === 0) return;
        const lastItem = currentRecipe.pop();
        const el = document.getElementById(lastItem.id);
        if (el) el.remove();
        updatePositions();
    }

    function clearAll() {
        if (currentRecipe.length === 0) return;
        currentRecipe.forEach(item => document.getElementById(item.id)?.remove());
        currentRecipe = [];
        updatePositions();
    }

    function updatePositions() {
        const bStick = document.getElementById('skewer-stick');
        let bIdx = 0, sIdx = 0, dIdx = 0;

        const posConfig = {
            burger: { burger: {x:'50%', s:1}, skewer: {x:'18%', s:0.55}, drink: {x:'82%', s:0.55} },
            skewer: { skewer: {x:'50%', s:1}, burger: {x:'18%', s:0.55}, drink: {x:'82%', s:0.55} },
            drink: { drink: {x:'50%', s:1}, burger: {x:'18%', s:0.55}, skewer: {x:'82%', s:0.55} }
        };

        const config = posConfig[currentTab];
        bStick.style.left = config.skewer.x;
        bStick.style.transform = `translateX(-50%) scale(${config.skewer.s})`;
        bStick.style.opacity = (currentTab === 'skewer') ? 1 : 0.4;

        const counts = { burger: 0, skewer: 0, drink: 0 };
        currentRecipe.forEach(item => counts[item.tab]++);

        const baseGap = { burger: 32, skewer: 55, drink: 65 };
        
        const shrinkBurger = counts.burger > 6 ? (6 / counts.burger) : 1;
        const shrinkSkewer = counts.skewer > 5 ? (5 / counts.skewer) : 1;
        const shrinkDrink  = counts.drink > 4 ? (4 / counts.drink) : 1;

        currentRecipe.forEach((item) => {
            const el = document.getElementById(item.id);
            if (!el) return;
            const c = config[item.tab];
            
            let finalScale = c.s;
            let currentGap = baseGap[item.tab] * c.s;

            if (item.tab === 'burger') {
                finalScale *= shrinkBurger;
                currentGap *= shrinkBurger;
                el.style.width = '240px'; el.style.left = c.x;
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${60 + (bIdx * currentGap)}px`;
                el.style.zIndex = bIdx + (item.tab === currentTab ? 100 : 10);
                bIdx++;
            } 
            else if (item.tab === 'skewer') {
                finalScale *= shrinkSkewer;
                currentGap *= shrinkSkewer;
                el.style.width = '160px'; el.style.left = c.x;
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${90 + (sIdx * currentGap)}px`;
                el.style.zIndex = sIdx + (item.tab === currentTab ? 100 : 10);
                sIdx++;
            } 
            else if (item.tab === 'drink') {
                finalScale *= shrinkDrink;
                currentGap *= shrinkDrink;
                el.style.width = '130px'; el.style.left = c.x;
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${60 + (dIdx * currentGap)}px`;
                el.style.zIndex = dIdx + (item.tab === currentTab ? 100 : 10);
                dIdx++;
            }
            el.style.opacity = (item.tab === currentTab) ? 1 : 0.5;
        });

        document.getElementById('item-list-content').innerHTML = currentRecipe.map((i, idx) => `<div>${idx+1}. ${i.name}</div>`).join('');
    }

    async function startFacePay() {
        if (currentRecipe.length === 0) return;
        const screen = document.getElementById('face-pay-screen');
        const video = document.getElementById('camera-view');
        const bar = document.getElementById('pay-bar');

        screen.style.display = 'flex';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
        } catch (e) {
            console.log("카메라 인식 스킵 후 바로 전송합니다.");
            sendFinalOrder();
            return;
        }

        setTimeout(() => { bar.style.width = '100%'; }, 200);

        setTimeout(() => {
            if(video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            sendFinalOrder();
        }, 3800);
    }

    function sendFinalOrder() {
        if (conn && conn.open) {
            conn.send({ customer: customerName, recipe: currentRecipe.map(i => i.name) });
            console.log("주문 데이터 주방으로 안전 송신 완료!");
        } else {
            console.log("통신 일시 단절 발생, 강제 연결 수립 후 즉시 재전송합니다.");
            conn = peer.connect('jinyeong-burger-kitchen-2026');
            setTimeout(() => {
                if(conn && conn.open) {
                    conn.send({ customer: customerName, recipe: currentRecipe.map(i => i.name) });
                } else {
                    alert("주방 화면이 활성화되어있지 않아 전송에 실패했습니다. 주방 모니터를 먼저 켜주세요.");
                }
            }, 1000);
        }
        
        document.getElementById('face-pay-screen').style.display = 'none';
        const now = new Date();
        document.getElementById('receipt-date').innerText = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        document.getElementById('receipt-user').innerText = `👤 ${customerName} 어린이`;
        document.getElementById('receipt-modal').style.display = 'flex';
    }

    function closeReceiptAndReload() {
        location.reload();
    }
</script>
</body>
</html>
