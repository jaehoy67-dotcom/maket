<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>진영 유치원 스마트 키오스크</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary-blue: #3B5998;
            --point-yellow: #FFD43B;
            --bg-soft: #F9F8F3;
            --text-dark: #333333;
        }

        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

        body { 
            font-family: 'Gaegu', 'Nanum Gothic', sans-serif; 
            background: var(--bg-soft); text-align: center; color: var(--text-dark);
            font-size: 1.2em; user-select: none; -webkit-user-select: none; display: flex; flex-direction: column;
        }
        
        #header-area { background: var(--primary-blue); padding: 10px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-shrink: 0; }
        #header-area h1 { margin: 0 0 8px 0; font-size: 1.5em; color: var(--point-yellow); letter-spacing: 1px; }
        
        .tab-bar { display: flex; justify-content: center; gap: 12px; }
        .tab-btn {
            background: rgba(255,255,255,0.2); border: 2px solid transparent; color: white;
            padding: 6px 20px; font-size: 1em; border-radius: 30px; cursor: pointer;
            font-family: 'Gaegu', sans-serif; font-weight: bold; transition: 0.2s;
        }
        .tab-btn.active { background: var(--point-yellow); color: var(--text-dark); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        #main-container { display: flex; flex: 1; position: relative; overflow: hidden; }
        
        #menu-bar {
            width: 20%; background: #FFF; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 5; box-sizing: border-box;
        }
        .btn-ing {
            background: #F0F3F6; border: 2px solid #E2E8F0; padding: 10px 5px; font-size: 0.95em;
            border-radius: 15px; cursor: pointer; font-family: 'Gaegu', sans-serif; font-weight: bold; transition: 0.15s;
        }
        .btn-ing:active { transform: scale(0.95); background: #E2E8F0; }

        #cooking-area { width: 60%; position: relative; background: #FFFDF7; background-image: radial-gradient(#EAE6D9 1.5px, transparent 1.5px); background-size: 24px 24px; overflow: hidden; }
        
        @keyframes popIn {
            0% { transform: translateX(-50%) scale(0) translateY(-250px); opacity: 0; }
            100% { transform: translateX(-50%) scale(var(--dynamic-scale, 1)) translateY(0); opacity: 1; }
        }
        .ing-img { position: absolute; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform-origin: bottom center; }
        
        #skewer-stick {
            position: absolute; bottom: 40px; width: 20px; height: 68%; max-height: 460px;
            background: #D7CCC8; border-radius: 10px; border: 3px solid #8D6E63; box-shadow: 3px 5px 10px rgba(0,0,0,0.15); transition: all 0.4s ease; transform-origin: bottom center;
        }

        #sidebar-right { width: 20%; background: #FFF; box-shadow: -2px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
        #item-list-box { flex: 1; padding: 12px; overflow-y: auto; text-align: left; border-bottom: 2px dashed #E2E8F0; }
        #item-list-box h3 { margin-top: 0; color: var(--primary-blue); font-size: 1.1em; border-bottom: 2px solid var(--primary-blue); padding-bottom: 5px; }
        #item-list-content { font-size: 0.9em; line-height: 1.4; color: #555; }
        
        .control-btns { padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #FAFBFD; flex-shrink: 0; }
        .btn-side { width: 100%; padding: 10px 0; font-size: 0.95em; border-radius: 12px; border: none; cursor: pointer; font-family: 'Gaegu', sans-serif; font-weight: bold; transition: 0.2s; box-sizing: border-box; }
        .btn-undo { background: #E0E0E0; color: #333; }
        .btn-clear { background: #FAB1A0; color: #C0392B; }
        .btn-order { background: #2ECC71; color: white; font-size: 1.1em; box-shadow: 0 4px 6px rgba(46,204,113,0.3); }
        .btn-order:active { transform: scale(0.98); }

        .fullscreen-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #id-screen input { font-size: 1.5em; padding: 12px; text-align: center; border-radius: 15px; border: 4px solid var(--point-yellow); width: 280px; margin-top: 20px; font-family: 'Gaegu', sans-serif; }
        
        #camera-container { position: relative; width: 280px; height: 280px; border-radius: 50%; border: 5px solid white; overflow: hidden; box-shadow: 0 0 20px rgba(255,255,255,0.5); background: #000; }
        #camera-view { width: 100%; height: 100%; transform: rotateY(180deg); object-fit: cover; }
        
        #pay-progress-container { width: 320px; height: 15px; background: #555; border-radius: 10px; margin-top: 25px; overflow: hidden; }
        #pay-bar { width: 0%; height: 100%; background: #2ECC71; }
        .start-fill { transition: width 3.6s linear !important; width: 100% !important; }

        .modal-box { background: white; color: #333; padding: 25px; border-radius: 25px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .receipt-line { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="id-screen" class="fullscreen-overlay">
        <h2 style="font-size: 1.8em; color: var(--point-yellow); margin-bottom: 5px;">바코드를 찍어주세요 🏷️</h2>
        <p style="font-size: 1.1em; margin: 0;">어린이의 이름을 키보드로 입력 후 엔터를 쳐도 됩니다.</p>
        <input type="text" id="barcode-input" placeholder="이름을 입력하세요..." autofocus>
    </div>

    <div id="face-pay-screen" class="fullscreen-overlay" style="display: none;">
        <h2 id="pay-title" style="font-size: 1.6em; color: var(--point-yellow); margin-bottom: 15px;">🔍 동그라미 안에 얼굴을 보여주세요!</h2>
        <div id="camera-container"><video id="camera-view" autoplay playsinline></video></div>
        <div id="pay-progress-container"><div id="pay-bar"></div></div>
        <p id="pay-status-text" style="margin-top: 15px; color: #FFD43B; font-weight: bold; font-size: 1.1em;">🙂 얼굴 탐색 중...</p>
    </div>

    <div id="receipt-modal" class="fullscreen-overlay" style="display: none;">
        <div class="modal-box">
            <div id="receipt-box-content">
                <h2 style="color: var(--primary-blue); margin-top:0;">🧾 주문 영수증</h2>
                <p style="font-size:0.85em; color:#777; margin:-10px 0 15px 0;" id="receipt-date">2026-00-00 00:00</p>
                <div style="border-top: 2px dashed #DDD; border-bottom: 2px dashed #DDD; padding: 15px 0; margin-bottom: 20px; text-align: left;">
                    <div class="receipt-line"><span style="font-weight: bold;" id="receipt-user">👤 어린이</span><span>주문 완료</span></div>
                    <div class="receipt-line" style="color: #E74C3C; font-weight:bold; font-size: 0.85em;" id="cook-status-text">🍳 맛있는 요리를 시작합니다!</div>
                </div>
                <p style="font-size:0.8em; color:#666; margin:0 0 10px 0;">주방에서 요리가 완성될 때까지<br>잠시만 기다려 주세요.</p>
            </div>
        </div>
    </div>

    <div id="header-area">
        <h1>🍔 진영 유치원 맛있는 요리조리 키오스크 🍕</h1>
        <div class="tab-bar">
            <button id="tab-burger" class="tab-btn" onclick="switchTab('burger')">🍔 수제버거</button>
            <button id="tab-skewer" class="tab-btn" onclick="switchTab('skewer')">🍢 모둠꼬치</button>
            <button id="tab-drink" class="tab-btn" onclick="switchTab('drink')">🥤 시원한음료</button>
        </div>
    </div>

    <div id="main-container">
        <div id="menu-bar"></div>
        <div id="cooking-area"><div id="skewer-stick"></div></div>
        <div id="sidebar-right">
            <div id="item-list-box">
                <h3>🛒 내가 담은 재료</h3>
                <div id="item-list-content"></div>
            </div>
            <div class="control-btns">
                <button class="btn-side btn-undo" onclick="undoLast()">↩ 하나 빼기</button>
                <button class="btn-side btn-clear" onclick="clearAll()">❌ 다 비우기</button>
                <button class="btn-side btn-order" onclick="startFacePay()">🚀 주문하기</button>
            </div>
        </div>
    </div>

<script>
    const peerOptions = {
        debug: 1,
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    };

    let peer = new Peer(peerOptions);
    let conn = null;
    let currentRecipe = [];
    let currentTab = 'burger';
    let customerName = "";
    let motionTimeout = null;
    let localStream = null;

    function connectToKitchen() {
        if (!conn || !conn.open) {
            conn = peer.connect('jinyeong-burger-kitchen-2026');
            conn.on('open', () => { console.log("주방망 연결 완료!"); });
            
            // 🛠 [요청 기능 구현]: 주방에서 보내오는 실시간 신호 대기 및 처리
            conn.on('data', (data) => {
                if (data.status === 'cook-finished') {
                    console.log("주방으로부터 요리 완료 수신:", data.childName);
                    
                    // 영수증 박스를 축하 화면 UI로 교체 교체
                    const receiptBox = document.getElementById('receipt-box-content');
                    receiptBox.innerHTML = `
                        <h2 style="color: #2ECC71; margin-top:0;">🎉 요리 완성! 🍟</h2>
                        <p style="font-size:1.2em; font-weight:bold; margin:15px 0; color:#333;">
                            🎵 ${data.childName} 친구!<br>맛있는 음식이 나왔어요!
                        </p>
                        <p style="font-size:0.9em; color:#666; margin-bottom:20px;">주방으로 와서 요리를 받아 가세요~</p>
                        <button class="btn-side btn-order" onclick="closeReceiptAndReload()">😃 맛있게 먹기 (처음으로)</button>
                    `;
                }
            });

            conn.on('close', () => { conn = null; setTimeout(connectToKitchen, 2000); });
            conn.on('error', () => { conn = null; });
        }
    }

    peer.on('open', () => { connectToKitchen(); });
    peer.on('disconnected', () => { peer.reconnect(); });

    const menus = {
        burger: [
            { id: 'bun_bottom', name: '아래빵', icon: '🍞' },
            { id: 'patty', name: '패티', icon: '🍖' },
            { id: 'lettuce', name: '양상추', icon: '🥬' },
            { id: 'cheese', name: '치즈', icon: '🧀' },
            { id: 'tomato', name: '토마토', icon: '🍅' },
            { id: 'bun_top', name: '위빵', icon: '🍞' }
        ],
        skewer: [
            { id: 'steak', name: '스테이크', icon: '🥩' },
            { id: 'shrimp', name: '새우', icon: '🍤' },
            { id: 'tomato', name: '방울토마토', icon: '🍅' },
            { id: 'pepper', name: '피망', icon: '🫑' }
        ],
        drink: [
            { id: 'cola', name: '콜라', icon: '🥤' },
            { id: 'cider', name: '사이다', icon: '🫧' },
            { id: 'juice', name: '주스', icon: '🧃' }
        ]
    };

    document.getElementById('barcode-input').addEventListener('change', (e) => {
        customerName = e.target.value.trim();
        if(!customerName) return;
        document.getElementById('id-screen').style.display = 'none';
        connectToKitchen();
        switchTab('burger');
    });

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        updatePositions();

        const menuBar = document.getElementById('menu-bar');
        menuBar.innerHTML = menus[tab].map(m => `
            <button class="btn-ing" onclick="addIng('${m.id}', '${m.icon} ${m.name}')">
                <span style="font-size:1.4em; display:block; margin-bottom:3px;">${m.icon}</span>${m.name}
            </button>
        `).join('');
    }

    function addIng(file, name) {
        const area = document.getElementById('cooking-area');
        const uniqueId = 'ing-' + Date.now();
        const img = document.createElement('img');
        img.src = `${file}.png`; img.id = uniqueId; img.className = 'ing-img';
        currentRecipe.push({ id: uniqueId, name: name, file: file, tab: currentTab });
        area.appendChild(img);
        updatePositions();
    }

    function undoLast() {
        if (currentRecipe.length === 0) return;
        const lastItem = currentRecipe.pop();
        document.getElementById(lastItem.id)?.remove();
        updatePositions();
    }

    function clearAll() {
        if (currentRecipe.length === 0) return;
        currentRecipe.forEach(item => document.getElementById(item.id)?.remove());
        currentRecipe = [];
        updatePositions();
    }

    function updatePositions() {
        const bStick = document.getElementById('skewer-stick');
        let bIdx = 0, sIdx = 0, dIdx = 0;

        const posConfig = {
            burger: { burger: {x:'50%', s:1}, skewer: {x:'18%', s:0.55}, drink: {x:'82%', s:0.55} },
            skewer: { skewer: {x:'50%', s:1}, burger: {x:'18%', s:0.55}, drink: {x:'82%', s:0.55} },
            drink: { drink: {x:'50%', s:1}, burger: {x:'18%', s:0.55}, skewer: {x:'82%', s:0.55} }
        };

        const config = posConfig[currentTab];
        bStick.style.left = config.skewer.x;
        bStick.style.transform = `translateX(-50%) scale(${config.skewer.s})`;
        bStick.style.opacity = (currentTab === 'skewer') ? 1 : 0.4;

        const counts = { burger: 0, skewer: 0, drink: 0 };
        currentRecipe.forEach(item => counts[item.tab]++);

        const baseGap = { burger: 26, skewer: 48, drink: 55 }; 
        
        const shrinkBurger = counts.burger > 6 ? (6 / counts.burger) : 1;
        const shrinkSkewer = counts.skewer > 5 ? (5 / counts.skewer) : 1;
        const shrinkDrink  = counts.drink > 4 ? (4 / counts.drink) : 1;

        currentRecipe.forEach((item) => {
            const el = document.getElementById(item.id);
            if (!el) return;
            const c = config[item.tab];
            
            let finalScale = c.s;
            let currentGap = baseGap[item.tab] * c.s;

            if (item.tab === 'burger') {
                finalScale *= shrinkBurger; currentGap *= shrinkBurger;
                el.style.width = '240px'; el.style.left = c.x;
                el.style.setProperty('--dynamic-scale', finalScale);
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${45 + (bIdx * currentGap)}px`;
                el.style.zIndex = bIdx + (item.tab === currentTab ? 100 : 10);
                bIdx++;
            } 
            else if (item.tab === 'skewer') {
                finalScale *= shrinkSkewer; currentGap *= shrinkSkewer;
                el.style.width = '160px'; el.style.left = c.x;
                el.style.setProperty('--dynamic-scale', finalScale);
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${75 + (sIdx * currentGap)}px`;
                el.style.zIndex = sIdx + (item.tab === currentTab ? 100 : 10);
                sIdx++;
            } 
            else if (item.tab === 'drink') {
                finalScale *= shrinkDrink; currentGap *= shrinkDrink;
                el.style.width = '130px'; el.style.left = c.x;
                el.style.setProperty('--dynamic-scale', finalScale);
                el.style.transform = `translateX(-50%) scale(${finalScale})`;
                el.style.bottom = `${45 + (dIdx * currentGap)}px`;
                el.style.zIndex = dIdx + (item.tab === currentTab ? 100 : 10);
                dIdx++;
            }
            el.style.opacity = (item.tab === currentTab) ? 1 : 0.5;
        });

        document.getElementById('item-list-content').innerHTML = currentRecipe.map((i, idx) => `<div>${idx+1}. ${i.name}</div>`).join('');
    }

    async function startFacePay() {
        if (currentRecipe.length === 0) return;
        const screen = document.getElementById('face-pay-screen');
        const video = document.getElementById('camera-view');
        const bar = document.getElementById('pay-bar');
        
        bar.style.width = '0%';
        bar.classList.remove('start-fill');
        document.getElementById('pay-title').innerText = "🔍 동그라미 안에 얼굴을 보여주세요!";
        document.getElementById('pay-status-text').innerText = "🙂 어린이 얼굴 탐색 중...";

        screen.style.display = 'flex';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            localStream = stream;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let prevBlendedData = null;

            function checkMotion() {
                if (screen.style.display === 'none') return;
                
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = 64; canvas.height = 48;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    if (prevBlendedData) {
                        let diff = 0;
                        for (let i = 0; i < currentData.data.length; i += 4) {
                            const rDiff = Math.abs(currentData.data[i] - prevBlendedData.data[i]);
                            const gDiff = Math.abs(currentData.data[i+1] - prevBlendedData.data[i+1]);
                            const bDiff = Math.abs(currentData.data[i+2] - prevBlendedData.data[i+2]);
                            if (rDiff + gDiff + bDiff > 90) diff++;
                        }
                        
                        if (diff > 80) { 
                            document.getElementById('pay-title').innerText = "✨ 얼굴 인식 성공!";
                            document.getElementById('pay-status-text').innerText = "🚀 맛있게 만들어 줄게요! 주방 전송 중...";
                            bar.classList.add('start-fill');
                            
                            motionTimeout = setTimeout(() => {
                                stopCamera();
                                sendFinalOrder();
                            }, 3600);
                            return;
                        }
                    }
                    prevBlendedData = currentData;
                }
                requestAnimationFrame(checkMotion);
            }
            requestAnimationFrame(checkMotion);

        } catch (e) {
            sendFinalOrder();
        }
    }

    function stopCamera() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
    }

    function sendFinalOrder() {
        const recipeData = currentRecipe.map(i => ({ name: i.name, file: i.file }));

        if (conn && conn.open) {
            conn.send({ customer: customerName, recipe: recipeData });
        } else {
            conn = peer.connect('jinyeong-burger-kitchen-2026');
            setTimeout(() => {
                if(conn && conn.open) conn.send({ customer: customerName, recipe: recipeData });
            }, 1000);
        }
        
        document.getElementById('face-pay-screen').style.display = 'none';
        const now = new Date();
        document.getElementById('receipt-date').innerText = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')} ${String(now.getMinutes()).padStart(2,'0')}`;
        document.getElementById('receipt-user').innerText = `👤 ${customerName} 어린이`;
        document.getElementById('receipt-modal').style.display = 'flex';
    }

    function closeReceiptAndReload() { 
        clearTimeout(motionTimeout);
        stopCamera();
        location.reload(); 
    }
</script>
</body>
</html>
