<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진영 유치원 주방 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; }
        #status-indicator { padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 1em; }
        .status-off { background: #E74C3C; }
        .status-on { background: #27AE60; }
        
        /* 실시간 로그 메시지 */
        #debug-console { background: #222; color: #0f0; padding: 10px; font-size: 0.8em; border-radius: 10px; margin-bottom: 20px; max-height: 100px; overflow-y: auto; font-family: monospace; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .order-card { background: white; color: #333; padding: 20px; border-radius: 20px; border-left: 10px solid #F39C12; box-shadow: 0 10px 20px rgba(0,0,0,0.3); animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .recipe-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .step { background: #F8F9FA; padding: 10px; border-radius: 10px; font-weight: bold; border: 1px solid #DDD; display: flex; align-items: center; }
        .step-num { color: #F39C12; margin-right: 10px; }
        
        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 10px; margin-top: 20px; width: 100%; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        #audio-btn { position: fixed; bottom: 20px; right: 20px; background: #F39C12; padding: 15px; border-radius: 10px; cursor: pointer; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>👨‍🍳 주방 주문 모니터</h1>
        <div id="status-indicator" class="status-off">시스템 연결 중...</div>
    </header>

    <div id="debug-console">시스템 로그: 연결을 기다리고 있습니다...</div>

    <div id="audio-btn" onclick="this.style.display='none'">🔔 주문 소리 켜기 (클릭 필수)</div>

    <div id="order-list" class="order-grid"></div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');
    const statusDiv = document.getElementById('status-indicator');
    const debugConsole = document.getElementById('debug-console');

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        debugConsole.innerHTML += `<div>[${time}] ${msg}</div>`;
        debugConsole.scrollTop = debugConsole.scrollHeight;
    }

    peer.on('open', (id) => {
        log("주방 시스템 가동 완료! ID: " + id);
        statusDiv.innerText = "✅ 주문 받기 대기 중";
        statusDiv.className = "status-on";
    });

    peer.on('error', (err) => {
        log("오류 발생: " + err.type);
        if(err.type === 'unavailable-id') {
            alert('주방 화면이 이미 열려있습니다. 창을 하나만 남겨주세요!');
        }
    });

    peer.on('connection', (conn) => {
        log("주문용 태블릿과 연결되었습니다!");
        
        conn.on('data', (data) => {
            log("데이터 수신: " + data.customer + "님의 주문!");
            
            // 만약 data.recipe가 문자열로 오거나 배열이 아닐 경우를 대비해 예외처리
            const recipes = Array.isArray(data.recipe) ? data.recipe : ["주문 정보 오류"];

            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <h2 style="margin:0;">🎈 ${data.customer || '손님'}</h2>
                <div class="recipe-list">
                    ${recipes.map((r, i) => `
                        <div class="step">
                            <span class="step-num">${i+1}</span>
                            <span>${r}</span>
                        </div>
                    `).join('')}
                </div>
                <button class="done-btn" onclick="this.parentElement.remove()">✅ 조리 완료</button>
            `;
            
            orderList.insertBefore(card, orderList.firstChild);
            
            // 벨소리
            try {
                const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
                audio.play();
            } catch(e) { log("소리 재생 실패 (화면을 클릭해주세요)"); }
        });
    });
</script>
</body>
</html>
