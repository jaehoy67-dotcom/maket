<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진영 유치원 주방 주문 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; margin: 0; }
        header { border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 20px; }
        
        /* 주문 카드 레이아웃 */
        .order-card { background: white; color: #333; padding: 20px; border-radius: 25px; display: flex; flex-direction: row; gap: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); min-height: 350px; }
        
        /* 왼쪽: 음식 그림 영역 */
        .food-preview { position: relative; width: 180px; height: 300px; background: #f9f9f9; border-radius: 15px; border: 2px dashed #ccc; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; overflow: hidden; }
        .preview-img { position: absolute; width: 140px; transition: all 0.3s; }

        /* 오른쪽: 주문 정보 영역 */
        .order-info { flex: 1; display: flex; flex-direction: column; }
        .recipe-list { margin-top: 10px; font-size: 0.9em; overflow-y: auto; max-height: 200px; }
        .step { background: #eee; padding: 5px 10px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; }

        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 15px; margin-top: auto; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        #audio-btn { position: fixed; bottom: 20px; right: 20px; background: #F39C12; padding: 15px; border-radius: 10px; cursor: pointer; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>👨‍🍳 실시간 요리 주문서</h1>
    </header>

    <div id="audio-btn" onclick="this.style.display='none'">🔔 소리 켜기 (클릭 필수)</div>

    <div id="order-list" class="order-grid">
        </div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');

    peer.on('open', (id) => console.log('주방 시스템 준비 완료!'));

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            console.log('주문 도착:', data);
            
            const card = document.createElement('div');
            card.className = 'order-card';

            // 이미지 쌓기 로직 (그림 생성)
            let imageStackHtml = '';
            if (data.fullRecipe && Array.isArray(data.fullRecipe)) {
                data.fullRecipe.forEach((item, index) => {
                    // 재료 종류(burger/skewer/drink)에 따라 높이 조절
                    let bottomPos = index * 20; 
                    if(item.tab === 'skewer') bottomPos = 50 + (index * 30);
                    
                    imageStackHtml += `
                        <img src="${item.file}.png" class="preview-img" 
                             style="bottom: ${bottomPos}px; z-index: ${index + 10};">
                    `;
                });
            }

            card.innerHTML = `
                <div class="food-preview">
                    ${imageStackHtml || '<p style="color:#ccc; margin-top:120px;">그림 없음</p>'}
                </div>
                <div class="order-info">
                    <h2 style="margin:0; color:#F39C12;">🎈 ${data.customer} 친구</h2>
                    <div class="recipe-list">
                        ${data.recipe.map((r, i) => `<div class="step">${i+1}. ${r}</div>`).join('')}
                    </div>
                    <button class="done-btn" onclick="this.parentElement.parentElement.remove()">✅ 요리 완료!</button>
                </div>
            `;
            
            orderList.insertBefore(card, orderList.firstChild);
            playAlert();
        });
    });

    function playAlert() {
        const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
        audio.play().catch(e => console.log("소리 재생 대기"));
    }
</script>
</body>
</html>
