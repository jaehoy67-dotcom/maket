<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진영 유치원 주방 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; }
        #status-indicator { padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; }
        .status-off { background: #E74C3C; }
        .status-on { background: #27AE60; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .order-card { background: white; color: #333; padding: 20px; border-radius: 20px; border-left: 10px solid #F39C12; box-shadow: 0 10px 20px rgba(0,0,0,0.3); animation: slideUp 0.5s ease-out; }
        
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .recipe-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .step { background: #F8F9FA; padding: 10px; border-radius: 10px; font-weight: bold; border: 1px solid #DDD; display: flex; align-items: center; }
        .step-num { color: #F39C12; margin-right: 10px; font-size: 1.1em; }
        
        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 10px; margin-top: 20px; width: 100%; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .done-btn:hover { background: #219150; }
        
        /* 알림음 활성화 안내 */
        #audio-notice { position: fixed; bottom: 20px; right: 20px; background: #F39C12; padding: 15px; border-radius: 10px; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>
    <header>
        <h1>👨‍🍳 실시간 주문 현황</h1>
        <div id="status-indicator" class="status-off">시스템 연결 중...</div>
    </header>

    <div id="audio-notice" onclick="this.style.display='none'">
        🔔 <b>여기를 클릭하면</b> 주문 소리가 활성화됩니다!
    </div>

    <div id="order-list" class="order-grid">
        </div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');
    const statusIndicator = document.getElementById('status-indicator');

    // 시스템 준비 완료
    peer.on('open', (id) => {
        console.log('주방 ID:', id);
        statusIndicator.innerText = "✅ 주방 대기 중";
        statusIndicator.className = "status-on";
    });

    // 연결 오류 발생 시
    peer.on('error', (err) => {
        console.error('오류 발생:', err.type);
        if(err.type === 'unavailable-id') {
            alert('이미 다른 주방 화면이 켜져 있습니다. 하나만 남기고 닫아주세요!');
            statusIndicator.innerText = "❌ 중복 연결 오류";
            statusIndicator.className = "status-off";
        }
    });

    // 주문 수신 로직
    peer.on('connection', (conn) => {
        console.log('새로운 주문용 태블릿 연결됨');
        
        conn.on('data', (data) => {
            console.log('수신 데이터:', data);
            
            // 1. 주문 카드 생성
            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="margin:0;">🎈 ${data.customer}</h2>
                    <span style="font-size:0.8em; color:#888;">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="recipe-list">
                    ${data.recipe.map((r, i) => `
                        <div class="step">
                            <span class="step-num">${i+1}</span>
                            <span>${r}</span>
                        </div>
                    `).join('')}
                </div>
                <button class="done-btn" onclick="completeOrder(this)">✅ 조리 완료</button>
            `;
            
            // 2. 리스트의 맨 앞에 추가 (최신 주문이 먼저 보이게)
            orderList.insertBefore(card, orderList.firstChild);
            
            // 3. 알림음 재생
            playAlert();
        });
    });

    function playAlert() {
        try {
            // 카카오톡 알림음 같은 상큼한 소리
            const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
            audio.play();
        } catch(e) {
            console.log("소리 재생 실패: 화면을 한 번 클릭해 주세요.");
        }
    }

    function completeOrder(btn) {
        const card = btn.parentElement;
        card.style.opacity = '0';
        card.style.transform = 'scale(0.9)';
        setTimeout(() => card.remove(), 300);
    }
</script>
</body>
</html>
