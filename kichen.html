<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> <title>진영 유치원 주방 주문 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; margin: 0; }
        header { border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }
        .order-card { background: white; color: #333; padding: 20px; border-radius: 25px; display: flex; flex-direction: row; gap: 20px; min-height: 350px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        /* 왼쪽: 음식 그림 영역 */
        .food-preview { position: relative; width: 160px; height: 300px; background: #f0f0f0; border-radius: 15px; border: 2px dashed #bbb; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; }
        .preview-img { position: absolute; width: 130px; transition: all 0.3s; }

        /* 오른쪽: 주문 정보 영역 */
        .order-info { flex: 1; display: flex; flex-direction: column; }
        .recipe-list { margin-top: 10px; font-size: 0.9em; flex-grow: 1; }
        .step { background: #eee; padding: 5px 10px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; border: 1px solid #ddd; }
        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 15px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #audio-btn { position: fixed; bottom: 20px; right: 20px; background: #F39C12; padding: 15px; border-radius: 10px; cursor: pointer; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>👨‍🍳 실시간 요리 주문서</h1></header>
    <div id="audio-btn" onclick="this.style.display='none'">🔔 소리 켜기 (클릭 필수)</div>
    <div id="order-list" class="order-grid"></div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');

    peer.on('open', () => console.log('주방 준비 완료!'));

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            console.log('주문 도착:', data);
            
            const card = document.createElement('div');
            card.className = 'order-card';

            // 이미지 쌓기 로직 (그림 생성)
            let imageStackHtml = '';
            if (data.fullRecipe && Array.isArray(data.fullRecipe)) {
                data.fullRecipe.forEach((item, index) => {
                    let bottomOffset = index * 25; // 햄버거 쌓기 높이
                    if (item.tab === 'skewer') bottomOffset = 40 + (index * 40); // 꼬치 쌓기 높이
                    
                    imageStackHtml += `
                        <img src="${item.file}.png" class="preview-img" 
                             style="bottom: ${bottomOffset}px; z-index: ${index + 10};">
                    `;
                });
            }

            card.innerHTML = `
                <div class="food-preview">${imageStackHtml || '<p style="color:#ccc; margin-top:130px;">그림 없음</p>'}</div>
                <div class="order-info">
                    <h2 style="margin:0; color:#F39C12;">🎈 ${data.customer} 친구</h2>
                    <div class="recipe-list">
                        ${data.recipe.map((r, i) => `<div class="step">${i+1}. ${r}</div>`).join('')}
                    </div>
                    <button class="done-btn" onclick="this.closest('.order-card').remove()">✅ 요리 완료!</button>
                </div>
            `;
            orderList.insertBefore(card, orderList.firstChild);
            
            const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
            audio.play().catch(() => {});
        });
    });
</script>
</body>
</html>
