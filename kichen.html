<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>진영 유치원 주방 주문 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; margin: 0; }
        header { border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 20px; }
        
        /* 주문 카드 레이아웃: 왼쪽(그림), 오른쪽(목록) */
        .order-card { background: white; color: #333; padding: 20px; border-radius: 25px; display: flex; flex-direction: row; gap: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); min-height: 380px; align-items: flex-start; }
        
        /* 🍔 [중요] 주방용 이미지 쌓기 영역 (index.html의 원리 적용) */
        .food-preview { 
            position: relative; 
            width: 180px; 
            height: 340px; 
            background: #f1f1f1; 
            border-radius: 15px; 
            border: 2px dashed #ccc; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            padding-bottom: 20px; 
            overflow: hidden; 
        }

        /* 층층이 쌓이는 재료 이미지 스타일 */
        .preview-img { 
            position: absolute; 
            width: 140px; 
            transition: all 0.3s ease; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .order-info { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .recipe-list { margin-top: 10px; font-size: 0.95em; overflow-y: auto; max-height: 220px; }
        .step { background: #eee; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; border: 1px solid #ddd; color: #555; }

        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 15px; margin-top: auto; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        #status { font-size: 0.8em; color: #27AE60; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>👨‍🍳 진영 자동차 마을 - 요리 주문서</h1>
        <div id="status">주방 연결 대기 중...</div>
    </header>

    <div id="order-list" class="order-grid">
        </div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');
    const statusText = document.getElementById('status');

    peer.on('open', (id) => {
        statusText.innerText = "✅ 주방 시스템 연결 완료 (ID: " + id + ")";
    });

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            console.log('주문 데이터 수신:', data);
            
            const card = document.createElement('div');
            card.className = 'order-card';

            // [핵심 로직] 전달받은 레시피를 바탕으로 이미지를 한 층씩 쌓아 올립니다.
            let imageStackHtml = '';
            let textListHtml = '';

            if (data.fullRecipe && Array.isArray(data.fullRecipe)) {
                data.fullRecipe.forEach((item, index) => {
                    // 재료 종류별 쌓기 간격 조절
                    let bottomPos = index * 25; // 기본(햄버거 등) 쌓기 간격
                    if(item.tab === 'skewer') bottomPos = 50 + (index * 45); // 꼬치는 조금 더 넓게
                    if(item.tab === 'drink') bottomPos = 30 + (index * 60);

                    // 깃허브 폴더에 있는 이미지 파일명을 사용해 <img> 태그 생성
                    imageStackHtml += `
                        <img src="${item.file}.png" class="preview-img" 
                             style="bottom: ${bottomPos}px; z-index: ${index + 100};">
                    `;

                    // 글자 목록 생성
                    textListHtml += `<div class="step">${index + 1}. ${item.name}</div>`;
                });
            }

            card.innerHTML = `
                <div class="food-preview">
                    ${imageStackHtml || '<p style="color:#ccc; margin-top:140px;">그림 데이터 없음</p>'}
                </div>
                <div class="order-info">
                    <h2 style="margin:0 0 10px 0; color:#F39C12;">🎈 ${data.customer || '친구'}의 주문</h2>
                    <div class="recipe-list">
                        ${textListHtml}
                    </div>
                    <button class="done-btn" onclick="this.closest('.order-card').remove()">✅ 요리 완료!</button>
                </div>
            `;
            
            // 최신 주문을 맨 앞에 추가
            orderList.insertBefore(card, orderList.firstChild);
            
            // 주문 알림음
            const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
            audio.play().catch(() => console.log("소리를 재생하려면 화면을 한 번 클릭해주세요."));
        });
    });
</script>
</body>
</html>
