<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진영 유치원 주방 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #555; padding-bottom: 10px; }
        #status { padding: 5px 15px; border-radius: 20px; font-weight: bold; background: #E74C3C; }
        .status-on { background: #27AE60 !important; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .order-card { background: white; color: #333; padding: 20px; border-radius: 20px; border-left: 10px solid #F39C12; animation: slideUp 0.5s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .step { background: #F8F9FA; padding: 8px; border-radius: 8px; margin-top: 5px; border: 1px solid #DDD; font-weight: bold; }
        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 10px; margin-top: 15px; width: 100%; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        #audio-btn { position: fixed; bottom: 20px; right: 20px; background: #F39C12; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>👨‍🍳 실시간 주문 현황</h1>
        <div id="status">시스템 연결 중...</div>
    </header>
    <div id="audio-btn" onclick="this.style.display='none'">🔔 여기를 눌러 알림음을 켜주세요!</div>
    <div id="order-list" class="order-grid"></div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');
    const statusDiv = document.getElementById('status');

    peer.on('open', () => {
        statusDiv.innerText = "✅ 주방 대기 중";
        statusDiv.className = "status-on";
    });

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <h3>🎈 ${data.customer}</h3>
                <div>${data.recipe.map((r, i) => `<div class="step">${i+1}. ${r}</div>`).join('')}</div>
                <button class="done-btn" onclick="this.parentElement.remove()">✅ 조리 완료</button>
            `;
            orderList.insertBefore(card, orderList.firstChild);
            playAlert();
        });
    });

    function playAlert() {
        const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
        audio.play().catch(() => console.log("화면 클릭 필요"));
    }
</script>
</body>
</html>
