<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>진영 유치원 주방 주문 시스템</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Nanum Gothic', sans-serif; padding: 20px; margin: 0; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 20px; }
        
        /* 주문 카드 레이아웃: 그림과 글자를 나란히 배치 */
        .order-card { background: white; color: #333; padding: 20px; border-radius: 25px; display: flex; gap: 20px; min-height: 380px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        /* 왼쪽: 음식 그림 영역 */
        .food-preview { position: relative; width: 180px; height: 340px; background: #f9f9f9; border-radius: 15px; border: 2px dashed #ccc; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; overflow: hidden; }
        .preview-img { position: absolute; width: 140px; transition: all 0.3s; }

        /* 오른쪽: 주문 정보 영역 */
        .order-info { flex: 1; display: flex; flex-direction: column; }
        .recipe-list { margin-top: 10px; font-size: 0.95em; overflow-y: auto; max-height: 220px; }
        .step { background: #eee; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; border: 1px solid #ddd; }

        .done-btn { background: #27AE60; color: white; border: none; padding: 15px; border-radius: 15px; margin-top: auto; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        #audio-btn { position: fixed; bottom: 20px; right: 20px; background: #F39C12; padding: 15px; border-radius: 10px; cursor: pointer; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#F39C12;">👨‍🍳 진영 자동차 마을 - 실시간 주문서</h1>
    <div id="audio-btn" onclick="this.style.display='none'">🔔 소리 켜기 (클릭 필수)</div>
    <div id="order-list" class="order-grid"></div>

<script>
    const KITCHEN_ID = 'jinyeong-burger-kitchen-2026';
    const peer = new Peer(KITCHEN_ID);
    const orderList = document.getElementById('order-list');

    peer.on('open', () => console.log('주방 시스템 가동!'));

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            console.log('데이터 수신:', data);
            const card = document.createElement('div');
            card.className = 'order-card';

            let imageStackHtml = '';
            let textListHtml = '';

            // 전달받은 fullRecipe 데이터를 사용하여 그림과 글자를 동시에 생성
            if (data.fullRecipe && Array.isArray(data.fullRecipe)) {
                data.fullRecipe.forEach((item, index) => {
                    // 1. 그림 생성 로직
                    let bottomOffset = index * 25; 
                    if (item.tab === 'skewer') bottomOffset = 50 + (index * 40);
                    imageStackHtml += `<img src="${item.file}.png" class="preview-img" style="bottom:${bottomOffset}px; z-index:${index+10};">`;
                    
                    // 2. 텍스트 리스트 생성
                    textListHtml += `<div class="step">${index + 1}. ${item.name}</div>`;
                });
            }

            card.innerHTML = `
                <div class="food-preview">${imageStackHtml || '<p style="color:#ccc; margin-top:140px;">그림 없음</p>'}</div>
                <div class="order-info">
                    <h2 style="margin:0 0 10px 0; color:#F39C12;">🎈 ${data.customer || '친구'}</h2>
                    <div class="recipe-list">${textListHtml}</div>
                    <button class="done-btn" onclick="this.closest('.order-card').remove()">✅ 요리 완료!</button>
                </div>
            `;
            orderList.insertBefore(card, orderList.firstChild);
            
            // 주문 알림음
            new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original').play().catch(() => {});
        });
    });
</script>
</body>
</html>
