<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주방용 모니터 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { 
            background: #2C3E50; 
            color: white; 
            font-family: 'Gaegu', 'Nanum Gothic', sans-serif; 
            padding: 20px;
            margin: 0;
            font-size: 1.4em;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }
        #status-bar {
            padding: 12px; text-align: center; border-radius: 10px; margin-bottom: 20px;
            font-weight: bold; font-size: 1.1em; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); transition: all 0.3s ease;
        }
        .status-waiting { color: #FFD43B; border: 2px solid #FFD43B; background: #34495E; }
        .status-ready { color: #2ECC71; border: 2px solid #2ECC71; background: #1E3024; }
        .status-connected { color: #3498DB; border: 2px solid #3498DB; background: #1A2A3A; }

        h1 { text-align: center; color: #FFD43B; font-size: 2em; margin-bottom: 30px; text-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        #order-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        .order-card { 
            background: white; color: #333; padding: 20px; border-radius: 20px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); display: flex; flex-direction: column;
            justify-content: space-between; border-top: 8px solid #E74C3C;
        }
        .order-card h2 { margin: 0 0 15px 0; font-size: 1.3em; color: #2C3E50; border-bottom: 2px dashed #EEE; padding-bottom: 8px;}
        
        .kitchen-recipe-container {
            display: flex; flex-direction: column-reverse; align-items: center;
            background: #F8F9FA; padding: 15px; border-radius: 12px; margin-bottom: 15px; gap: 2px; min-height: 100px;
        }
        .kitchen-ing-img { width: 120px; height: auto; object-fit: contain; }
        .order-text-summary { font-size: 0.85em; color: #666; text-align: left; margin-bottom: 10px; line-height: 1.3; }

        .done-btn {
            background: #2ECC71; color: white; border: none; padding: 12px; border-radius: 12px;
            cursor: pointer; font-size: 1em; font-family: 'Gaegu', sans-serif; font-weight: bold;
            transition: 0.2s; box-shadow: 0 4px 0 #27AE60;
        }
        .done-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #27AE60; }

        /* 🎉 조리 완료 팝업 전체화면 스크린 스타일 */
        .complete-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease-out;
        }
        .complete-box {
            background: white; color: #333; padding: 40px; border-radius: 30px;
            text-align: center; box-shadow: 0 10px 30px rgba(255,212,59,0.3);
            border: 6px solid #FFD43B; animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .complete-box h1 { color: #E74C3C; font-size: 3em; margin: 0 0 10px 0; }
        .complete-box h2 { color: #2C3E50; font-size: 1.8em; margin: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popUp { from { transform: scale(0.7); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="status-bar" class="status-waiting">📡 주방 서버 통신망 구축 중...</div>
    <h1>👨‍🍳 진영 주방 주문 접수 현황</h1>
    <div id="order-list"></div>

<script>
    const statusBar = document.getElementById('status-bar');
    const orderList = document.getElementById('order-list');
    let activeConn = null; // 키오스크와 신호를 주고받을 전역 연결 채널

    // 🛠 내장 메뉴 데이터 선언 완료
    const menus = {
        burger: [
            { id: 'bun_bottom', name: '아래빵', icon: '🍞' },
            { id: 'patty', name: '패티', icon: '🍖' },
            { id: 'lettuce', name: '양상추', icon: '🥬' },
            { id: 'cheese', name: '치즈', icon: '🧀' },
            { id: 'tomato', name: '토마토', icon: '🍅' },
            { id: 'bun_top', name: '위빵', icon: '🍞' }
        ],
        skewer: [
            { id: 'steak', name: '스테이크', icon: '🥩' },
            { id: 'shrimp', name: '새우', icon: '🍤' },
            { id: 'tomato', name: '방울토마토', icon: '🍅' },
            { id: 'pepper', name: '피망', icon: '🫑' }
        ],
        drink: [
            { id: 'cola', name: '콜라', icon: '🥤' },
            { id: 'cider', name: '사이다', icon: '🫧' },
            { id: 'juice', name: '주스', icon: '🧃' }
        ]
    };

    const peer = new Peer('jinyeong-burger-kitchen-2026', {
        debug: 1,
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', (id) => {
        statusBar.innerText = "🟢 주방 오픈! 손님(키오스크)을 기다리는 중입니다...";
        statusBar.className = "status-ready";
    });

    peer.on('connection', (conn) => {
        activeConn = conn;
        statusBar.innerText = "🤝 키오스크 연결 완료! 실시간 주문 접수가 가능합니다.";
        statusBar.className = "status-connected";
        
        conn.on('close', () => {
            statusBar.innerText = "🟢 주방 오픈! 손님(키오스크)을 기다리는 중입니다...";
            statusBar.className = "status-ready";
            activeConn = null;
        });

        conn.on('data', (data) => {
            const card = document.createElement('div');
            card.className = 'order-card';
            
            // 전송받은 영수증 텍스트 요약화
            const textSummary = data.recipe.map((r, idx) => `${idx+1}.${r.name}`).join(', ');

            // 이미지 소스 렌더링 매핑
            const imagesHtml = data.recipe.map(r => {
                return `<img src="${r.file}.png" class="kitchen-ing-img" alt="${r.name}">`;
            }).join('');

            card.innerHTML = `
                <div>
                    <h2>🎈 ${data.customer} 어린이 주문</h2>
                    <div class="order-text-summary">📋 ${textSummary}</div>
                    <div class="kitchen-recipe-container">
                        ${imagesHtml}
                    </div>
                </div>
                <button class="done-btn" onclick="finishOrder(this, '${data.customer}')">✅ 조리 완료</button>
            `;
            orderList.appendChild(card);
            
            const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
            audio.play().catch(e => console.log("자동재생 인터랙션 활성화"));
        });
    });

    // 🛠 [요청 기능 구현]: 조리 완료 공정 처리 통제 함수
    function finishOrder(button, name) {
        const card = button.closest('.order-card');
        
        // 1. 키오스크 기기로 역방향 '요리 완료 고유 무선 신호' 발송 처리
        if (activeConn && activeConn.open) {
            activeConn.send({ status: 'cook-finished', childName: name });
        }

        showCompleteScreen(name);
        speakOrder(name);
        setTimeout(() => { card.remove(); }, 500);
    }

    function showCompleteScreen(name) {
        const screen = document.createElement('div');
        screen.className = 'complete-screen';
        screen.innerHTML = `<div class="complete-box"><h1>🍔 완료! 🍟</h1><h2>🎉 ${name} 친구 주문 나왔어요~</h2></div>`;
        document.body.appendChild(screen);
        setTimeout(() => { screen.remove(); }, 4000);
    }

    function speakOrder(name) {
        if(!window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(`${name} 친구 주문 나왔어요`);
        utterance.lang = 'ko-KR';
        window.speechSynthesis.speak(utterance);
    }

    peer.on('error', (err) => {
        statusBar.innerText = "❌ 연결 지연 발생. 새로고침을 해주세요.";
        statusBar.className = "status-waiting";
    });
</script>
</body>
</html>
