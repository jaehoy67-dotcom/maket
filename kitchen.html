<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주방용 모니터 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { 
            background: #2C3E50; 
            color: white; 
            font-family: 'Gaegu', 'Nanum Gothic', sans-serif; 
            padding: 30px;
            margin: 0;
            font-size: 1.4em;
        }
        h1 {
            text-align: center;
            color: #FFD43B;
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        #order-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .order-card { 
            background: white; 
            color: #333; 
            padding: 25px; 
            border-radius: 25px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
            border-top: 10px solid #3B5998; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .order-card h2 { margin: 0 0 15px 0; font-size: 1.3em; color: #3B5998; border-bottom: 2px dashed #EEE; padding-bottom: 10px;}
        .recipe-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .step { background: #F8F9FA; padding: 8px 15px; border-radius: 12px; font-weight: bold; border: 1px solid #E9ECEF; font-size: 0.95em; }
        .done-btn { 
            background: #2ECC71; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 15px; 
            font-size: 1em; 
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 4px 0 #27AE60;
            font-family: 'Gaegu', sans-serif;
            transition: all 0.1s;
        }
        .done-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #27AE60; }
    </style>
</head>
<body>
    <h1>👨‍🍳 진영 주방 주문 접수 현황</h1>
    <div id="order-list"></div>

<script>
    // 🛠 고정 아이디 'jinyeong-burger-kitchen-2026'로 주방 수신 서버 실행
    const peer = new Peer('jinyeong-burger-kitchen-2026');
    const orderList = document.getElementById('order-list');

    peer.on('open', (id) => {
        console.log("주방 서버 수신 대기 시작! ID:", id);
    });

    peer.on('connection', (conn) => {
        console.log("손님용 키오스크 기기와 무선 연결망 확립!");
        
        conn.on('data', (data) => {
            console.log("주문 데이터 정상 수신 완료:", data);
            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div>
                    <h2>🎈 ${data.customer} 어린이 주문</h2>
                    <div class="recipe-list">
                        ${data.recipe.map((r, i) => `<div class="step">🔹 ${r}</div>`).join('')}
                    </div>
                </div>
                <button class="done-btn" onclick="this.parentElement.remove()">✅ 조리 완료</button>
            `;
            orderList.appendChild(card);
            
            // 알림음 재생
            const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
            audio.play().catch(e => console.log("알림 오디오 자동 재생 차단 해제 대기 중"));
        });
    });

    peer.on('error', (err) => {
        console.error("주방 서버 피어 에러 발생:", err);
    });
</script>
</body>
</html>
