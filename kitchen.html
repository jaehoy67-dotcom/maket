<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주방용 모니터 시스템</title>

<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

body{
    background:#2C3E50;
    color:white;
    font-family:'Gaegu','Nanum Gothic',sans-serif;
    padding:30px;
    margin:0;
    font-size:1.4em;
}

h1{
    text-align:center;
    color:#FFD43B;
    font-size:2em;
    margin-bottom:10px;
}

#server-status{
    text-align:center;
    margin-bottom:25px;
    font-size:0.9em;
}

#order-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
    max-width:1200px;
    margin:0 auto;
}

.order-card{
    background:white;
    color:#333;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
    border-top:10px solid #3B5998;
    animation:popIn 0.3s ease-out;
}

@keyframes popIn{
    from{
        transform:scale(0.9);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.order-card h2{
    margin:0 0 15px 0;
    color:#3B5998;
}

.recipe-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.step{
    background:#F8F9FA;
    padding:8px 15px;
    border-radius:12px;
    font-weight:bold;
}

.done-btn{
    margin-top:18px;
    width:100%;
    background:#2ECC71;
    color:white;
    border:none;
    padding:12px;
    border-radius:15px;
    font-size:1em;
    font-family:'Gaegu',sans-serif;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>👨‍🍳 진영 주방 주문 접수 현황</h1>

<div id="server-status">
🟡 서버 시작 중...
</div>

<div id="order-list"></div>

<script>

const orderList = document.getElementById('order-list');
const statusText = document.getElementById('server-status');

let peer;

startKitchenServer();

function startKitchenServer(){

    peer = new Peer(
        'jinyeong-burger-kitchen-2026',
        {
            debug:1
        }
    );

    peer.on('open', (id)=>{

        console.log('주방 서버 시작:', id);

        statusText.innerHTML =
            '🟢 주문 수신 대기 중';
    });

    peer.on('connection', handleConnection);

    peer.on('disconnected', ()=>{

        console.log('Peer 연결 끊김');

        statusText.innerHTML =
            '🔴 연결 끊김 → 재연결 중';

        try{
            peer.reconnect();
        }catch(e){
            console.log(e);
        }
    });

    peer.on('close', ()=>{

        console.log('Peer 종료');

        statusText.innerHTML =
            '🔴 서버 재시작 중';

        setTimeout(()=>{
            startKitchenServer();
        },2000);
    });

    peer.on('error', (err)=>{

        console.log('Peer 오류:', err);

        statusText.innerHTML =
            '🔴 서버 오류 발생';
    });
}

function handleConnection(conn){

    console.log('키오스크 연결됨');

    conn.on('data', (data)=>{

        console.log('주문 수신:', data);

        addOrderCard(data);

        playSound();
    });

    conn.on('close', ()=>{

        console.log('키오스크 연결 종료');
    });
}

function addOrderCard(data){

    const card = document.createElement('div');

    card.className = 'order-card';

    card.innerHTML = `
        <div>
            <h2>🎈 ${data.customer} 어린이 주문</h2>

            <div class="recipe-list">
                ${data.recipe.map(r=>`
                    <div class="step">
                        🔹 ${r}
                    </div>
                `).join('')}
            </div>
        </div>

        <button class="done-btn">
            ✅ 조리 완료
        </button>
    `;

    card.querySelector('.done-btn').onclick = ()=>{
        card.remove();
    };

    orderList.prepend(card);
}

function playSound(){

    const audio = new Audio(
        'https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg'
    );

    audio.play().catch(()=>{});
}

</script>

</body>
</html>
