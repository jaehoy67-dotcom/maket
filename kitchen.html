<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>진영 유치원 주방 주문 시스템</title>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>

        body {
            background: #333;
            color: white;
            font-family: 'Nanum Gothic', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .order-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px,1fr));
            gap: 20px;
        }

        .order-card {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 25px;
            display: flex;
            gap: 20px;
            min-height: 380px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .food-preview {
            position: relative;
            width: 160px;
            height: 340px;
            background: #eee;
            border-radius: 15px;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            overflow: hidden;
        }

        .preview-img {
            position: absolute;
            width: 130px;
            transition: all 0.3s;
        }

        .order-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .step {
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 5px;
            font-weight: bold;
            border: 1px solid #ddd;
        }

        .done-btn {
            background: #27AE60;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            margin-top: auto;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>

<body>

<h1 style="text-align:center; color:#F39C12;">
    👨‍🍳 실시간 요리 주문서 
</h1>

<div id="order-list" class="order-grid"></div>

<script>

const menus = {

    burger: [
        { id:'bun_bottom', name:'아래빵', icon:'🍞' },
        { id:'patty', name:'패티', icon:'🍖' },
        { id:'lettuce', name:'양상추', icon:'🥬' },
        { id:'cheese', name:'치즈', icon:'🧀' },
        { id:'tomato', name:'토마토', icon:'🍅' },
        { id:'bun_top', name:'위빵', icon:'🍞' }
    ],

    skewer: [
        { id:'steak', name:'스테이크', icon:'🥩' },
        { id:'shrimp', name:'새우', icon:'🍤' },
        { id:'tomato', name:'방울토마토', icon:'🍅' },
        { id:'pepper', name:'피망', icon:'🫑' }
    ],

    drink: [
        { id:'cola', name:'콜라', icon:'🥤' },
        { id:'cider', name:'사이다', icon:'🫧' },
        { id:'juice', name:'주스', icon:'🧃' }
    ]
};

const peer = new Peer(
    'jinyeong-burger-kitchen-2026',
    {
        host: '0.peerjs.com',
        secure: true,
        port: 443,
        debug: 2
    }
);

peer.on('open', (id) => {

    console.log('주방 서버 준비 완료:', id);

    alert('주방 연결 준비 완료!');
});

peer.on('error', (err) => {

    console.error(err);

    alert('주방 오류 : ' + err.type);
});

peer.on('connection', (conn) => {

    console.log('주문기 연결됨');

    conn.on('data', (data) => {

        console.log('주문 도착!', data);

        const card = document.createElement('div');

        card.className = 'order-card';

        let imgHtml = '';

        let listHtml = '';

        if(data.fullRecipe &&
           Array.isArray(data.fullRecipe)) {

            let burgerIndex = 0;
            let skewerIndex = 0;
            let drinkIndex = 0;

            data.fullRecipe.forEach((item, idx) => {

                const menuInfo =
                    menus[item.tab]
                    ?.find(m => m.id === item.file);

                const displayName =
                    menuInfo
                    ? `${menuInfo.icon} ${menuInfo.name}`
                    : item.name;

                let bottom = 0;

                if(item.tab === 'burger') {

                    bottom = 20 + burgerIndex * 25;

                    burgerIndex++;
                }

                else if(item.tab === 'skewer') {

                    bottom = 20 + skewerIndex * 45;

                    skewerIndex++;
                }

                else {

                    bottom = 20 + drinkIndex * 55;

                    drinkIndex++;
                }

                imgHtml += `
                    <img
                        src="${item.file}.png"
                        class="preview-img"
                        style="
                            bottom:${bottom}px;
                            z-index:${idx + 10};
                        "
                    >
                `;

                listHtml += `
                    <div class="step">
                        ${idx + 1}. ${displayName}
                    </div>
                `;
            });
        }

        card.innerHTML = `

            <div class="food-preview">
                ${imgHtml}
            </div>

            <div class="order-info">

                <h2 style="margin:0 0 10px 0;">
                    🎈 ${data.customer} 친구
                </h2>

                <div style="flex-grow:1; overflow-y:auto;">
                    ${listHtml}
                </div>

                <button
                    class="done-btn"
                    onclick="this.closest('.order-card').remove()">

                    ✅ 요리 완료

                </button>

            </div>
        `;

        document.getElementById('order-list')
        .insertBefore(
            card,
            document.getElementById('order-list').firstChild
        );

        try {

            new Audio(
                'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'
            ).play();

        } catch(e) {
            console.log('효과음 실패');
        }
    });
});

</script>

</body>
</html>
