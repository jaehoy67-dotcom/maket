<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진영 유치원 주방 주문 시스템</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
    body{ margin:0; padding:20px; background:#2C3E50; font-family:'Nanum Gothic', sans-serif; overflow-x:hidden; }
    h1{ text-align:center; color:#F39C12; margin-bottom:25px; font-size:2.3rem; }
    .order-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(700px,1fr)); gap:25px; }
    .order-card{ background:white; border-radius:30px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.4); display:flex; flex-direction:column; gap:20px; position:relative; overflow:hidden; }
    .top-section{ display:flex; justify-content:space-between; align-items:center; }
    .customer-name{ font-size:2rem; font-weight:bold; color:#E67E22; }
    .order-time{ font-size:1rem; color:#888; }
    .food-wrapper{ display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    .food-box{ width:180px; height:320px; background:#F7F7F7; border-radius:20px; border:3px dashed #DDD; position:relative; overflow:hidden; display:flex; justify-content:center; align-items:flex-end; padding-bottom:20px; }
    .food-title{ position:absolute; top:10px; left:50%; transform:translateX(-50%); font-weight:bold; font-size:1.1rem; }
    .preview-img{ position:absolute; transition:all 0.3s; }
    .recipe-list{ background:#FAFAFA; border-radius:15px; padding:15px; }
    .step{ background:white; border:1px solid #DDD; border-radius:10px; padding:10px; margin-bottom:8px; font-weight:bold; }
    .done-btn{ border:none; background:#27AE60; color:white; padding:18px; border-radius:18px; font-size:1.2rem; font-weight:bold; cursor:pointer; transition:0.2s; }
    .cooking-badge{ position:absolute; top:15px; right:15px; background:#F39C12; color:white; padding:8px 14px; border-radius:30px; font-weight:bold; animation:pulse 1s infinite; }
    @keyframes pulse{ 0%{ transform:scale(1); } 50%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
    .cooking-bar-wrap{ width:100%; height:18px; background:#EEE; border-radius:30px; overflow:hidden; }
    .cooking-bar{ height:100%; width:0%; background:#F39C12; transition:width linear; }
    .status-bar{ position:fixed; top:10px; right:10px; background:white; padding:10px 18px; border-radius:15px; font-weight:bold; color:#27AE60; z-index:999; }
</style>
</head>
<body>
<div class="status-bar" id="statusBar">🟡 연결 대기 중...</div>
<h1>👨‍🍳 주방 주문 확인서 👨‍🍳</h1>
<div class="order-grid" id="order-list"></div>
<script>
let activeConns = {};
const peer = new Peer('jinyeong-burger-kitchen-2026',{ host:'0.peerjs.com', secure:true, port:443, debug:2 });
peer.on('open',()=>document.getElementById('statusBar').innerHTML='🟢 주방 운영 중');
peer.on('connection',(conn)=>{
    activeConns[conn.peer] = conn;
    conn.on('data',(data)=>{ data.peerId=conn.peer; createCard(data); playBell(); });
});

function createCard(data){
    let bH='', sH='', dH='', lH='', bI=0, sI=0, dI=0;
    data.fullRecipe.forEach((i,idx)=>{
        lH += `<div class="step">${idx+1}. ${i.name}</div>`;
        if(i.tab==='burger'){ bH+=`<img src="${i.file}.png" class="preview-img" style="width:140px; bottom:${20+bI*24}px; z-index:${bI+10}">`; bI++; }
        else if(i.tab==='skewer'){ sH+=`<img src="${i.file}.png" class="preview-img" style="width:100px; bottom:${20+sI*45}px; z-index:${sI+10}">`; sI++; }
        else if(i.tab==='drink'){ dH+=`<img src="${i.file}.png" class="preview-img" style="width:100px; bottom:${20+dI*55}px; z-index:${dI+10}">`; dI++; }
    });
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `<div class="cooking-badge">🔥 조리 중</div><div class="top-section"><div class="customer-name">🎈 ${data.customer} 어린이</div></div><div class="food-wrapper"><div class="food-box"><div class="food-title">🍔 햄버거</div>${bH}</div><div class="food-box"><div class="food-title">🍢 꼬치</div>${sH}</div><div class="food-box"><div class="food-title">🥤 음료</div>${dH}</div></div><div class="recipe-list">${lH}</div><div class="cooking-bar-wrap"><div class="cooking-bar"></div></div><button class="done-btn" onclick="finishOrder(this,'${data.customer}','${data.peerId}')">✅ 요리 완료</button>`;
    document.getElementById('order-list').insertBefore(card, document.getElementById('order-list').firstChild);
    setTimeout(()=>{ const bar=card.querySelector('.cooking-bar'); bar.style.transition='width 15s linear'; bar.style.width='100%'; },100);
}

function finishOrder(btn, name, peerId){
    if(activeConns[peerId]) activeConns[peerId].send({ type:'FINISHED', customer:name });
    btn.closest('.order-card').remove();
    // 주방에서도 음성 안내 (선택사항)
    const u = new SpeechSynthesisUtterance(`${name} 요리 완료 신호를 보냈습니다.`);
    u.lang='ko-KR'; speechSynthesis.speak(u);
}

function playBell(){ try{ new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3').play(); }catch(e){} }
</script>
</body>
</html>
