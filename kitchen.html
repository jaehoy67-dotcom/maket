<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진영 유치원 주방 모니터</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
body{
    background:#2C3E50;
    color:white;
    font-family:'Gaegu','Nanum Gothic',sans-serif;
    padding:30px;
    margin:0;
    font-size:1.4em;
}
h1{
    text-align:center;
    color:#FFD43B;
    font-size:2em;
    margin-bottom:10px;
}
#server-status{
    text-align:center;
    margin-bottom:25px;
    font-size:0.9em;
}
#order-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:20px;
    max-width:1400px;
    margin:0 auto;
}
.order-card{
    background:white;
    color:#333;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
    border-top:10px solid #3B5998;
    animation:popIn 0.3s ease-out;
}
@keyframes popIn{
    from{ transform:scale(0.9); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}
.order-card h2{
    margin:0 0 15px 0;
    color:#3B5998;
}
.order-text-summary{
    background:#F8F9FA;
    padding:12px 15px;
    border-radius:15px;
    margin-bottom:15px;
    font-size:0.9em;
    line-height:1.5;
}
.kitchen-recipe-container{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:flex-start;
    align-items:flex-start;
}
.kitchen-ing-item{
    background:#F8F9FA;
    border-radius:15px;
    padding:10px;
    width:90px;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.kitchen-ing-img{
    width:55px;
    height:55px;
    object-fit:contain;
    margin-bottom:5px;
}
.ing-name{
    font-size:0.75em;
    text-align:center;
    line-height:1.2;
    word-break:keep-all;
}
.done-btn{
    margin-top:18px;
    width:100%;
    background:#2ECC71;
    color:white;
    border:none;
    padding:14px;
    border-radius:15px;
    font-size:1em;
    font-family:'Gaegu',sans-serif;
    cursor:pointer;
}
.done-btn:active{
    transform:scale(0.98);
}
</style>
</head>
<body>

<h1>👨‍🍳 진영 유치원 주방 모니터</h1>
<div id="server-status">🟡 서버 시작 중...</div>
<div id="order-list"></div>

<script>
const orderList = document.getElementById('order-list');
const statusText = document.getElementById('server-status');

// 주방 매칭용 메뉴 데이터 탑재 (필수)
const menusDict = {
    'bun_top': { name: '위빵', icon: '🍞' },
    'patty': { name: '패티', icon: '🍖' },
    'lettuce': { name: '양상추', icon: '🥬' },
    'cheese': { name: '치즈', icon: '🧀' },
    'tomato': { name: '토마토', icon: '🍅' },
    'bun_bottom': { name: '아래빵', icon: '🍞' },
    'steak': { name: '스테이크', icon: '🥩' },
    'shrimp': { name: '새우', icon: '🍤' },
    'pepper': { name: '피망', icon: '🫑' },
    'cola': { name: '콜라', icon: '🥤' },
    'cider': { name: '사이다', icon: '🫧' },
    'juice': { name: '주스', icon: '🧃' }
};

const peer = new Peer(
    'jinyeong-burger-kitchen-2026',
    {
        debug:1,
        config:{
            iceServers:[
                { urls:'stun:stun.l.google.com:19302' },
                { urls:'stun:stun1.l.google.com:19302' },
                { urls:'stun:stun2.l.google.com:19302' }
            ]
        }
    }
);

peer.on('open', (id)=>{
    statusText.innerHTML = '🟢 주문 수신 대기 중';
});

peer.on('connection', (conn)=>{
    conn.on('data', (data)=>{
        addOrderCard(data, conn);
    });
});

function addOrderCard(data, conn){
    const card = document.createElement('div');
    card.className = 'order-card';

    // 안전하게 복구된 ID 데이터를 바탕으로 텍스트 요약 생성
    const textSummary = data.recipe.map((r, idx)=>{
        const itemInfo = menusDict[r.file] || { name: r.file || '재료', icon: '🍔' };
        return `${idx + 1}. ${itemInfo.icon}${itemInfo.name}`;
    }).join(', ');

    // index.html과 완벽히 호환되는 로컬 이미지 노출 방식
    const imagesHtml = data.recipe.map(r=>{
        const itemInfo = menusDict[r.file] || { name: r.file || '재료', icon: '🍔' };
        const localImageUrl = `${r.file}.png`; // 예: bun_top.png

        return `
            <div class="kitchen-ing-item">
                <img
                    src="${localImageUrl}"
                    class="kitchen-ing-img"
                    alt="${itemInfo.name}"
                    onerror="this.style.opacity='0.2';"
                >
                <div class="ing-name">${itemInfo.icon} ${itemInfo.name}</div>
            </div>
        `;
    }).join('');

    card.innerHTML = `
        <div>
            <h2>🎈 ${data.customer || '어린이'} 주문</h2>
            <div class="order-text-summary">📋 ${textSummary}</div>
            <div class="kitchen-recipe-container">${imagesHtml}</div>
        </div>
        <button class="done-btn">✅ 조리 완료</button>
    `;

    card.querySelector('.done-btn').onclick = ()=>{
        try{
            conn.send({
                status:'cook-finished',
                childName:data.customer
            });
        }catch(e){}
        card.remove();
    };

    orderList.prepend(card);
    playOrderSound();
}

peer.on('disconnected', ()=>{
    statusText.innerHTML = '🔴 재연결 중...';
    try{ peer.reconnect(); }catch(e){}
});

peer.on('error', (err)=>{
    statusText.innerHTML = '🔴 서버 오류';
});

function playOrderSound(){
    const audio = new Audio('https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg');
    audio.play().catch(()=>{});
}
</script>
</body>
</html>
