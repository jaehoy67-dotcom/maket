<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진영 유치원 주방 주문 시스템</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* 기존 스타일 동일 */
        body{ margin:0; padding:20px; background:#2C3E50; font-family:'Nanum Gothic', sans-serif; overflow-x:hidden; }
        h1{ text-align:center; color:#F39C12; margin-bottom:25px; font-size:2.3rem; }
        .order-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(700px,1fr)); gap:25px; }
        .order-card{ background:white; border-radius:30px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.4); display:flex; flex-direction:column; gap:20px; position:relative; overflow:hidden; }
        .card-header{ display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #F39C12; padding-bottom:15px; }
        .customer-name{ font-size:2rem; font-weight:bold; color:#2C3E50; }
        .card-body{ display:flex; gap:30px; height:400px; }
        .visual-area{ flex:1.2; background:#ECF0F1; border-radius:20px; position:relative; display:flex; justify-content:center; align-items:flex-end; padding-bottom:20px; border:2px dashed #BDC3C7; }
        .preview-img{ position:absolute; width:180px; transition:all 0.5s ease; }
        .info-area{ flex:1; display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding-right:10px; }
        .step-item{ background:#FFF; border:2px solid #F39C12; padding:12px 18px; border-radius:15px; font-weight:bold; font-size:1.1rem; color:#2C3E50; display:flex; align-items:center; gap:10px; }
        .done-btn{ background:#27AE60; color:white; border:none; padding:20px; border-radius:20px; font-size:1.5rem; font-weight:bold; cursor:pointer; transition:transform 0.2s; box-shadow:0 6px 0 #1E8449; }
        .done-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #1E8449; }
        .cooking-timer{ height:12px; background:#EEE; border-radius:6px; overflow:hidden; }
        .cooking-bar{ width:0%; height:100%; background:#F39C12; }
        .complete-screen{ position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(46,204,113,0.95); z-index:9999; display:flex; justify-content:center; align-items:center; animation:fadeIn 0.5s; }
        .complete-box{ text-align:center; color:white; }
        .complete-box h1{ font-size:5rem; color:white; margin-bottom:20px; }
        .complete-box h2{ font-size:3rem; }
        @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    </style>
</head>
<body>
    <h1>👨‍🍳 진영 유치원 주방 주문 모니터</h1>
    <div id="order-list" class="order-grid"></div>

<script>
    const peer = new Peer('jinyeong-burger-kitchen-2026', { host: '0.peerjs.com', secure: true, port: 443 });

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            const card = document.createElement('div');
            card.className = 'order-card';
            
            let imgHtml = '';
            let listHtml = '';
            let counts = { burger: 0, skewer: 0, drink: 0 };

            data.fullRecipe.forEach((item, idx) => {
                let leftPos = "50%", bottomPos = 20, imgWidth = "160px";
                if(item.tab === 'burger'){ leftPos = "25%"; bottomPos = 30 + (counts.burger * 35); imgWidth = "220px"; counts.burger++; }
                else if(item.tab === 'skewer'){ leftPos = "55%"; bottomPos = 50 + (counts.skewer * 55); imgWidth = "140px"; counts.skewer++; }
                else if(item.tab === 'drink'){ leftPos = "85%"; bottomPos = 30 + (counts.drink * 70); imgWidth = "120px"; counts.drink++; }

                imgHtml += `<img src="${item.file}.png" class="preview-img" style="left:${leftPos}; bottom:${bottomPos}px; width:${imgWidth}; transform:translateX(-50%); z-index:${100+idx};">`;
                listHtml += `<div class="step-item"><span>${idx+1}</span> ${item.name}</div>`;
            });

            card.innerHTML = `
                <div class="card-header"><div class="customer-name">🎈 ${data.customer} 친구</div></div>
                <div class="card-body">
                    <div class="visual-area">${imgHtml}</div>
                    <div class="info-area">${listHtml}</div>
                </div>
                <div class="cooking-timer"><div class="cooking-bar"></div></div>
                <button class="done-btn">✅ 요리 완료</button>
            `;

            // 중요: 버튼 클릭 시 주문기(conn)로 신호 보냄
            card.querySelector('.done-btn').onclick = () => {
                conn.send({ type: 'COOKING_DONE' }); // <--- 신호 전송 한 줄 추가
                finishOrder(card.querySelector('.done-btn'), data.customer);
            };

            document.getElementById('order-list').insertBefore(card, document.getElementById('order-list').firstChild);
            startTimer(card);
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(()=>{});
        });
    });

    function startTimer(card) {
        const bar = card.querySelector('.cooking-bar');
        setTimeout(() => { bar.style.transition = 'width 15s linear'; bar.style.width = '100%'; }, 100);
    }

    function finishOrder(button, name) {
        const card = button.closest('.order-card');
        showCompleteScreen(name);
        speakOrder(name);
        setTimeout(() => { card.remove(); }, 500);
    }

    function showCompleteScreen(name) {
        const screen = document.createElement('div');
        screen.className = 'complete-screen';
        screen.innerHTML = `<div class="complete-box"><h1>🍔 완료! 🍟</h1><h2>🎉 ${name} 친구 주문 나왔어요~</h2></div>`;
        document.body.appendChild(screen);
        setTimeout(() => { screen.remove(); }, 4000);
    }

    function speakOrder(name) {
        if(!window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(`${name} 친구 주문 나왔어요`);
        utterance.lang = 'ko-KR';
        window.speechSynthesis.speak(utterance);
    }
</script>
</body>
</html>
