<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진영 유치원 주방 모니터</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
body{
    background:#2C3E50;
    color:white;
    font-family:'Gaegu','Nanum Gothic',sans-serif;
    padding:30px;
    margin:0;
    font-size:1.4em;
}
h1{
    text-align:center;
    color:#FFD43B;
    font-size:2em;
    margin-bottom:10px;
}
#server-status{
    text-align:center;
    margin-bottom:25px;
    font-size:0.9em;
}
#order-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
    gap:20px;
    max-width:1400px;
    margin:0 auto;
}
.order-card{
    background:white;
    color:#333;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
    border-top:10px solid #3B5998;
    animation:popIn 0.3s ease-out;
}
@keyframes popIn{
    from{ transform:scale(0.9); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}
.order-card h2{
    margin:0 0 15px 0;
    color:#3B5998;
}
.order-text-summary{
    background:#F8F9FA;
    padding:12px 15px;
    border-radius:15px;
    margin-bottom:15px;
    font-size:0.9em;
    line-height:1.5;
}
/* 주방 조리 구역 배치: 버거 / 꼬치 / 음료가 가로로 따로 분리됨 */
.kitchen-display-zones {
    display: flex;
    justify-content: space-around;
    background: #EDF1F5;
    padding: 15px 5px;
    border-radius: 20px;
    margin-bottom: 15px;
    min-height: 220px;
}
.food-zone {
    display: flex;
    flex-direction: column-reverse; /* 아래에서부터 차곡차곡 위로 쌓이게 처리 */
    align-items: center;
    width: 30%;
    position: relative;
    border-right: 1px dashed #CCC;
}
.food-zone:last-child { border-right: none; }
.zone-title {
    position: absolute;
    bottom: -12px;
    font-size: 0.65em;
    color: #777;
    background: #FFF;
    padding: 2px 6px;
    border-radius: 10px;
    border: 1px solid #DDD;
}
/* 쌓이는 이미지 컴포넌트 구조 설정 (키오스크의 축소판 겹치기 구조) */
.kitchen-stack-item {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -35px; /* 이미지들이 실감나게 위로 겹쳐 쌓이도록 마진 설정 */
}
.kitchen-stack-item:first-child { margin-top: 0; } /* 맨 아래 재료는 마진 제외 */

.kitchen-ing-img {
    width: 90px;
    height: auto;
    object-fit: contain;
}
/* 꼬치나 음료는 크기 커스텀 조정 */
.zone-skewer .kitchen-ing-img { width: 75px; }
.zone-drink .kitchen-ing-img { width: 65px; margin-top: -45px; }

.ing-name-badge {
    font-size: 0.55em;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 1px 5px;
    border-radius: 5px;
    margin-top: -5px;
    z-index: 10;
}
.done-btn{
    margin-top:18px;
    width:100%;
    background:#2ECC71;
    color:white;
    border:none;
    padding:14px;
    border-radius:15px;
    font-size:1em;
    font-family:'Gaegu',sans-serif;
    cursor:pointer;
}
.done-btn:active{
    transform:scale(0.98);
}
</style>
</head>
<body>

<h1>👨‍🍳 진영 유치원 주방 모니터</h1>
<div id="server-status">🟡 서버 시작 중...</div>
<div id="order-list"></div>

<script>
const orderList = document.getElementById('order-list');
const statusText = document.getElementById('server-status');

const menusDict = {
    'bun_top': { name: '위빵', icon: '🍞' },
    'patty': { name: '패티', icon: '🍖' },
    'lettuce': { name: '양상추', icon: '🥬' },
    'cheese': { name: '치즈', icon: '🧀' },
    'tomato': { name: '토마토', icon: '🍅' },
    'bun_bottom': { name: '아래빵', icon: '🍞' },
    'steak': { name: '스테이크', icon: '🥩' },
    'shrimp': { name: '새우', icon: '🍤' },
    'pepper': { name: '피망', icon: '🫑' },
    'cola': { name: '콜라', icon: '🥤' },
    'cider': { name: '사이다', icon: '🫧' },
    'juice': { name: '주스', icon: '🧃' }
};

const peer = new Peer(
    'jinyeong-burger-kitchen-2026',
    {
        debug:1,
        config:{
            iceServers:[
                { urls:'stun:stun.l.google.com:19302' },
                { urls:'stun:stun1.l.google.com:19302' },
                { urls:'stun:stun2.l.google.com:19302' }
            ]
        }
    }
);

peer.on('open', (id)=>{
    statusText.innerHTML = '🟢 주문 수신 대기 중';
});

peer.on('connection', (conn)=>{
    conn.on('data', (data)=>{
        addOrderCard(data, conn);
    });
});

function addOrderCard(data, conn){
    const card = document.createElement('div');
    card.className = 'order-card';

    // 전체 요약 생성
    const textSummary = data.recipe.map((r, idx)=>{
        const itemInfo = menusDict[r.file] || { name: r.file || '재료', icon: '🍔' };
        return `${itemInfo.icon}${itemInfo.name}`;
    }).join(', ');

    // 햄버거, 꼬치, 음료수 분류 처리용 배열
    let burgerHtml = '';
    let skewerHtml = '';
    let drinkHtml = '';

    // 수신된 순서대로 HTML 요소를 쌓아 올림
    data.recipe.forEach(r => {
        const itemInfo = menusDict[r.file] || { name: r.file || '재료', icon: '🍔' };
        const localImageUrl = `${r.file}.png`;
        const itemHtml = `
            <div class="kitchen-stack-item">
                <img src="${localImageUrl}" class="kitchen-ing-img" alt="${itemInfo.name}">
                <div class="ing-name-badge">${itemInfo.icon} ${itemInfo.name}</div>
            </div>
        `;

        // 종류(tab)에 맞춰서 각각의 조리 벽면에 배치함
        if (r.tab === 'burger' || ['bun_top', 'patty', 'lettuce', 'cheese', 'tomato', 'bun_bottom'].includes(r.file)) {
            burgerHtml += itemHtml;
        } else if (r.tab === 'skewer' || ['steak', 'shrimp', 'pepper'].includes(r.file)) {
            skewerHtml += itemHtml;
        } else if (r.tab === 'drink' || ['cola', 'cider', 'juice'].includes(r.file)) {
            drinkHtml += itemHtml;
        }
    });

    card.innerHTML = `
        <div>
            <h2>🎈 ${data.customer || '어린이'} 주문</h2>
            <div class="order-text-summary">📋 ${textSummary}</div>
            
            <div class="kitchen-display-zones">
                <div class="food-zone zone-burger">
                    <div class="zone-title">🍔 버거</div>
                    ${burgerHtml || '<div style="font-size:0.7em; color:#AAA; margin-bottom:20px;">선택 없음</div>'}
                </div>
                <div class="food-zone zone-skewer">
                    <div class="zone-title">🍢 꼬치</div>
                    ${skewerHtml || '<div style="font-size:0.7em; color:#AAA; margin-bottom:20px;">선택 없음</div>'}
                </div>
                <div class="food-zone zone-drink">
                    <div class="zone-title">🥤 음료</div>
                    ${drinkHtml || '<div style="font-size:0.7em; color:#AAA; margin-bottom:20px;">선택 없음</div>'}
                </div>
            </div>
        </div>
        <button class="done-btn">✅ 조리 완료</button>
    `;

    card.querySelector('.done-btn').onclick = ()=>{
        try{
            conn.send({
                status:'cook-finished',
                childName:data.customer
            });
        }catch(e){}
        card.remove();
    };

    orderList.prepend(card);
    playOrderSound();
}

peer.on('disconnected', ()=>{
    statusText.innerHTML = '🔴 재연결 중...';
    try{ peer.reconnect(); }catch(e){}
});

peer.on('error', (err)=>{
    statusText.innerHTML = '🔴 서버 오류';
});

function playOrderSound(){
    const audio = new Audio('https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg');
    audio.play().catch(()=>{});
}
</script>
</body>
</html>
