<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주방용 모니터 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { 
            background: #2C3E50; 
            color: white; 
            font-family: 'Gaegu', 'Nanum Gothic', sans-serif; 
            padding: 20px;
            margin: 0;
            font-size: 1.4em;
        }
        #status-bar {
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .status-waiting { color: #FFD43B; border: 2px solid #FFD43B; background: #34495E; }
        .status-ready { color: #2ECC71; border: 2px solid #2ECC71; background: #1E3024; }
        .status-connected { color: #3498DB; border: 2px solid #3498DB; background: #1A2A3A; }

        h1 {
            text-align: center;
            color: #FFD43B;
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        #order-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .order-card { 
            background: white; 
            color: #333; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 8px solid #E74C3C;
        }
        .order-card h2 { margin: 0 0 15px 0; font-size: 1.3em; color: #2C3E50; border-bottom: 2px dashed #EEE; padding-bottom: 8px;}
        
        /* 🍔 주방 내부 음식 이미지 차곡차곡 리스트 스타일 */
        .kitchen-recipe-container {
            display: flex;
            flex-direction: column-reverse; /* 아래서부터 위로 쌓이도록 연출 */
            align-items: center;
            background: #F8F9FA;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            gap: 2px;
            min-height: 100px;
        }
        .kitchen-ing-img {
            width: 120px;
            height: auto;
            object-fit: contain;
        }
        .order-text-summary {
            font-size: 0.85em;
            color: #666;
            text-align: left;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .done-btn {
            background: #2ECC71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-family: 'Gaegu', sans-serif;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 0 #27AE60;
        }
        .done-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #27AE60; }
    </style>
</head>
<body>

    <div id="status-bar" class="status-waiting">📡 주방 서버 통신망 구축 중...</div>
    <h1>👨‍🍳 진영 주방 주문 접수 현황</h1>
    <div id="order-list"></div>

<script>
    const statusBar = document.getElementById('status-bar');
    const orderList = document.getElementById('order-list');

    const peer = new Peer('jinyeong-burger-kitchen-2026', {
        debug: 1,
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', (id) => {
        statusBar.innerText = "🟢 주방 오픈! 손님(키오스크)을 기다리는 중입니다...";
        statusBar.className = "status-ready";
    });

    peer.on('connection', (conn) => {
        statusBar.innerText = "🤝 키오스크 연결 완료! 실시간 주문 접수가 가능합니다.";
        statusBar.className = "status-connected";
        
        conn.on('close', () => {
            statusBar.innerText = "🟢 주방 오픈! 손님(키오스크)을 기다리는 중입니다...";
            statusBar.className = "status-ready";
        });

        conn.on('data', (data) => {
            const card = document.createElement('div');
            card.className = 'order-card';
            
            // 텍스트 요약본 생성
            const textSummary = data.recipe.map((r, idx) => `${idx+1}.${r.name}`).join(', ');

            // 🛠 넘겨받은 이미지 코드(file)를 분석해 주방 모니터에도 동일한 이미지 엘리먼트 동적 생성
            const imagesHtml = data.recipe.map(r => {
                return `<img src="${r.file}.png" class="kitchen-ing-img" alt="${r.name}">`;
            }).join('');

            card.innerHTML = `
                <div>
                    <h2>🎈 ${data.customer} 어린이 주문</h2>
                    <div class="order-text-summary">📋 ${textSummary}</div>
                    <div class="kitchen-recipe-container">
                        ${imagesHtml}
                    </div>
                </div>
                <button class="done-btn" onclick="this.parentElement.remove()">✅ 조리 완료</button>
            `;
            orderList.appendChild(card);
            
            const audio = new Audio('https://t1.daumcdn.net/cfile/tistory/99412B355A38B17305?original');
            audio.play().catch(e => console.log("오디오 재생 차단 해제 대기"));
        });
    });

    peer.on('error', (err) => {
        statusBar.innerText = "❌ 연결 지연 발생. 새로고침을 해주세요.";
        statusBar.className = "status-waiting";
    });
</script>
</body>
</html>
