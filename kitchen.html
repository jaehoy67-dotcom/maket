<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>진영 유치원 주방 시스템</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    background:#2C3E50;
    font-family:'Nanum Gothic', sans-serif;
    overflow-x:hidden;
}

h1{
    text-align:center;
    color:#F39C12;
    font-size:2.5rem;
    margin-bottom:25px;
}

/* 연결 상태 */

#status-bar{
    position:fixed;
    top:10px;
    right:10px;
    background:white;
    padding:10px 18px;
    border-radius:15px;
    font-weight:bold;
    z-index:999;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* 주문 목록 */

#order-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(750px,1fr));
    gap:25px;
}

/* 카드 */

.order-card{
    background:white;
    border-radius:30px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    gap:20px;
    position:relative;
}

/* 상단 */

.top-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.customer-name{
    font-size:2rem;
    font-weight:bold;
    color:#E67E22;
}

.order-time{
    color:#888;
    font-size:1rem;
}

/* 음식 영역 */

.food-wrapper{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.food-box{
    width:180px;
    height:320px;
    background:#F7F7F7;
    border-radius:20px;
    border:3px dashed #DDD;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:20px;
}

.food-title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.1rem;
    font-weight:bold;
}

.preview-img{
    position:absolute;
    transition:all 0.3s;
}

/* 레시피 */

.recipe-list{
    background:#FAFAFA;
    border-radius:15px;
    padding:15px;
}

.step{
    background:white;
    border:1px solid #DDD;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
    font-weight:bold;
}

/* 버튼 */

.done-btn{
    border:none;
    background:#27AE60;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:1.2rem;
    font-weight:bold;
    cursor:pointer;
}

.done-btn:hover{
    transform:scale(1.03);
}

/* 신규 주문 애니메이션 */

.new-order{

    animation:pop 0.4s;

}

@keyframes pop{

    0%{
        transform:scale(0.7);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

@media(max-width:900px){

    #order-list{
        grid-template-columns:1fr;
    }

    .food-wrapper{
        flex-direction:column;
        align-items:center;
    }

}

</style>
</head>

<body>

<div id="status-bar">
🟡 연결 준비중...
</div>

<h1>👨‍🍳 실시간 주방 주문서 👨‍🍳</h1>

<div id="order-list"></div>

<script>

const orderList =
    document.getElementById('order-list');

const statusBar =
    document.getElementById('status-bar');

/* 메뉴 */

const menus = {

    burger:[
        { id:'bun_bottom', name:'아래빵', icon:'🍞' },
        { id:'patty', name:'패티', icon:'🍖' },
        { id:'lettuce', name:'양상추', icon:'🥬' },
        { id:'cheese', name:'치즈', icon:'🧀' },
        { id:'tomato', name:'토마토', icon:'🍅' },
        { id:'bun_top', name:'위빵', icon:'🍞' }
    ],

    skewer:[
        { id:'steak', name:'스테이크', icon:'🥩' },
        { id:'shrimp', name:'새우', icon:'🍤' },
        { id:'tomato', name:'방울토마토', icon:'🍅' },
        { id:'pepper', name:'피망', icon:'🫑' }
    ],

    drink:[
        { id:'cola', name:'콜라', icon:'🥤' },
        { id:'cider', name:'사이다', icon:'🫧' },
        { id:'juice', name:'주스', icon:'🧃' }
    ]
};

/* Peer */

const peer = new Peer(
    'jinyeong-burger-kitchen-2026',
    {
        host:'0.peerjs.com',
        secure:true,
        port:443,
        debug:2
    }
);

peer.on('open',(id)=>{

    console.log('주방 서버 시작');

    statusBar.innerHTML =
        '🟢 연결 준비 완료';

});

peer.on('error',(err)=>{

    console.error(err);

    statusBar.innerHTML =
        '🔴 연결 오류';

});

/* 주문 받기 */

peer.on('connection',(conn)=>{

    conn.on('data',(data)=>{

        if(data.type === 'order'){

            createOrderCard(data,conn);

            playOrderVoice();

        }

    });

});

/* 주문 카드 */

function createOrderCard(data,conn){

    let burgerHtml = '';
    let skewerHtml = '';
    let drinkHtml = '';

    let burgerIndex = 0;
    let skewerIndex = 0;
    let drinkIndex = 0;

    let listHtml = '';

    if(data.fullRecipe &&
       Array.isArray(data.fullRecipe)){

        data.fullRecipe.forEach((item,idx)=>{

            const menuInfo =
                menus[item.tab]
                ?.find(m=>m.id===item.file);

            const displayName =
                menuInfo
                ? `${menuInfo.icon} ${menuInfo.name}`
                : item.name;

            listHtml += `

                <div class="step">

                    ${idx+1}. ${displayName}

                </div>

            `;

            /* 햄버거 */

            if(item.tab === 'burger'){

                burgerHtml += `

                    <img
                        src="${item.file}.png"
                        class="preview-img"
                        style="
                            width:140px;
                            bottom:${20 + burgerIndex * 24}px;
                            z-index:${burgerIndex + 10};
                        "
                    >

                `;

                burgerIndex++;

            }

            /* 꼬치 */

            else if(item.tab === 'skewer'){

                skewerHtml += `

                    <img
                        src="${item.file}.png"
                        class="preview-img"
                        style="
                            width:100px;
                            bottom:${20 + skewerIndex * 45}px;
                            z-index:${skewerIndex + 10};
                        "
                    >

                `;

                skewerIndex++;

            }

            /* 음료 */

            else if(item.tab === 'drink'){

                drinkHtml += `

                    <img
                        src="${item.file}.png"
                        class="preview-img"
                        style="
                            width:100px;
                            bottom:${20 + drinkIndex * 55}px;
                            z-index:${drinkIndex + 10};
                        "
                    >

                `;

                drinkIndex++;

            }

        });

    }

    const now = new Date();

    const timeText =
        now.getHours()
        .toString()
        .padStart(2,'0')
        + ':'
        +
        now.getMinutes()
        .toString()
        .padStart(2,'0');

    const card =
        document.createElement('div');

    card.className =
        'order-card new-order';

    card.innerHTML = `

        <div class="top-section">

            <div class="customer-name">

                🎈 ${data.customer} 친구

            </div>

            <div class="order-time">

                ${timeText}

            </div>

        </div>

        <div class="food-wrapper">

            <!-- 햄버거 -->

            <div class="food-box">

                <div class="food-title">

                    🍔 햄버거

                </div>

                ${burgerHtml}

            </div>

            <!-- 꼬치 -->

            <div class="food-box">

                <div class="food-title">

                    🍢 꼬치

                </div>

                ${skewerHtml}

            </div>

            <!-- 음료 -->

            <div class="food-box">

                <div class="food-title">

                    🥤 음료

                </div>

                ${drinkHtml}

            </div>

        </div>

        <div class="recipe-list">

            ${listHtml}

        </div>

        <button
            class="done-btn">

            ✅ 요리 완료

        </button>

    `;

    /* 완료 버튼 */

    card
    .querySelector('.done-btn')
    .addEventListener('click',()=>{

        try{

            conn.send({

                type:'complete',

                customer:data.customer

            });

        }catch(e){

            console.log(e);

        }

        card.remove();

    });

    orderList.insertBefore(
        card,
        orderList.firstChild
    );

}

/* 주문 효과음 */

function playOrderVoice(){

    // 띵동 효과음

    try{

        const audio =
            new Audio(
                'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8630b1cfd.mp3'
            );

        audio.volume = 1;

        audio.play();

    }catch(e){

        console.log(e);

    }

    // 음성 안내

    setTimeout(()=>{

        if(!window.speechSynthesis) return;

        const utterance =
            new SpeechSynthesisUtterance(
                '딩동 주문이 들어왔습니다'
            );

        utterance.lang = 'ko-KR';

        utterance.rate = 0.9;

        speechSynthesis.speak(utterance);

    },700);

}

</script>

</body>
</html>
