<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주방용 모니터 시스템</title>

<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body{
    background:#2C3E50;
    color:white;
    font-family:'Gaegu', sans-serif;
    padding:30px;
    margin:0;
}

h1{
    text-align:center;
    color:#FFD43B;
    font-size:2em;
}

#status{
    text-align:center;
    margin-bottom:20px;
    font-size:1.1em;
}

#order-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.order-card{
    background:white;
    color:#333;
    border-radius:25px;
    padding:20px;
    border-top:10px solid #3B5998;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.order-card h2{
    margin-top:0;
    color:#3B5998;
}

.step{
    background:#F5F5F5;
    padding:8px 12px;
    border-radius:10px;
    margin-bottom:8px;
    font-weight:bold;
}

.done-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:15px;
    background:#2ECC71;
    color:white;
    font-size:1em;
    font-family:'Gaegu', sans-serif;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>👨‍🍳 진영 주방 주문 현황</h1>
<div id="status">🟡 서버 연결 중...</div>
<div id="order-list"></div>

<script>

const orderList = document.getElementById('order-list');
const statusText = document.getElementById('status');

let peer;

function startKitchenServer(){

    peer = new Peer('jinyeong-burger-kitchen-2026', {
        debug: 2
    });

    peer.on('open', () => {
        console.log('주방 서버 실행 완료');
        statusText.innerText = '🟢 주문 수신 대기 중';
    });

    peer.on('connection', (conn) => {

        console.log('키오스크 연결됨');

        conn.on('data', (data) => {

            console.log('주문 도착:', data);

            addOrderCard(data);

            playSound();
        });

        conn.on('close', () => {
            console.log('키오스크 연결 종료');
        });
    });

    peer.on('disconnected', () => {

        statusText.innerText = '🔴 연결 끊김 → 재연결 시도 중';

        peer.reconnect();
    });

    peer.on('error', (err) => {

        console.log(err);

        statusText.innerText = '🔴 서버 오류 발생';

        setTimeout(() => {
            peer.destroy();
            startKitchenServer();
        }, 3000);
    });
}

function addOrderCard(data){

    const card = document.createElement('div');

    card.className = 'order-card';

    card.innerHTML = `
        <h2>🎈 ${data.customer} 어린이</h2>

        ${data.recipe.map(r => `
            <div class="step">${r}</div>
        `).join('')}

        <button class="done-btn">
            ✅ 조리 완료
        </button>
    `;

    card.querySelector('.done-btn').onclick = () => {
        card.remove();
    };

    orderList.prepend(card);
}

function playSound(){

    const audio = new Audio(
        'https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg'
    );

    audio.play().catch(() => {});
}

startKitchenServer();

</script>

</body>
</html>
